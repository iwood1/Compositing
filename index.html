<pre id="devlog"></pre>

<script>
// =====================================================================
// 0. DEV LOG & FLAGS — shared, in-memory, used by every later system
// =====================================================================
// Loaded before Three.js so it works (and records the failure) even if the
// CDN load fails. Everything here is global on purpose: poke it from the
// console as DevLog.events / DevLog.flags.
//   logEvent(category, message, data?)  timestamped, stored, echoed to console
//   setFlag(name, value) / getFlag(name, fallback?) / incFlag(name, by?)
// Press ` (backquote / ~ key) to toggle the on-screen overlay.
const DevLog = {
  events: [],        // every event this session, oldest first (never trimmed)
  flags: {},         // discrete state: booleans, counters, strings
  t0: performance.now(),
  visible: false,
  dirty: true,       // overlay needs a redraw
  MAX_SHOWN: 15,
};

function logEvent(category, message, data) {
  const e = { t: (performance.now() - DevLog.t0) / 1000, time: new Date().toISOString(), category, message, data };
  DevLog.events.push(e);
  DevLog.dirty = true;
  const print = /error|warn/i.test(category) ? console.warn : console.log;
  print(`[${e.t.toFixed(2)}s] [${category}] ${message}`, ...(data === undefined ? [] : [data]));
  return e;
}
function setFlag(name, value) {
  const prev = DevLog.flags[name];
  DevLog.flags[name] = value;
  if (prev !== value) DevLog.dirty = true;
  return prev;
}
function getFlag(name, fallback) {
  return name in DevLog.flags ? DevLog.flags[name] : fallback;
}
function incFlag(name, by = 1) {   // convenience for counters (e.g. resonance tallies)
  return setFlag(name, getFlag(name, 0) + by);
}

// Overlay: redrawn at most ~10x/s, and only while open and something changed
function renderDevLog() {
  if (!DevLog.visible || !DevLog.dirty) return;
  DevLog.dirty = false;
  const fmt = (v) => (typeof v === 'string' ? v : JSON.stringify(v));
  const flagLines = Object.keys(DevLog.flags).sort().map((k) => `  ${k} = ${fmt(DevLog.flags[k])}`);
  const eventLines = DevLog.events.slice(-DevLog.MAX_SHOWN).map((e) =>
    `  ${e.t.toFixed(2).padStart(7)}s  [${e.category}] ${e.message}${e.data === undefined ? '' : '  ' + fmt(e.data)}`);
  const el = document.getElementById('devlog');
  el.textContent =
    `FLAGS (${flagLines.length})\n${flagLines.join('\n') || '  (none)'}\n\n` +
    `EVENTS (last ${eventLines.length} of ${DevLog.events.length})\n${eventLines.join('\n') || '  (none)'}`;
  el.scrollTop = el.scrollHeight;   // if it overflows, keep the newest events in view
}
setInterval(renderDevLog, 100);

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Backquote') return;
  DevLog.visible = !DevLog.visible;
  DevLog.dirty = true;
  document.getElementById('devlog').classList.toggle('open', DevLog.visible);
  renderDevLog();
});

// Anything that throws later (including in the render loop) lands in the log
window.addEventListener('error', (e) => logEvent('error', e.message, { src: e.filename, line: e.lineno }));
window.addEventListener('unhandledrejection', (e) => logEvent('error', 'unhandled rejection', String(e.reason)));
logEvent('system', 'dev log ready');
</script>

<!-- Three.js r128, pinned UMD build (exposes global THREE). See DESIGN.md §9. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// =====================================================================
// 1. CONFIG — tuning knobs for "does walking feel right?"
// =====================================================================
const CONFIG = {
  eyeHeight: 1.6,          // metres
  playerRadius: 0.3,       // collision radius in the XZ plane
  walkSpeed: 3.0,          // m/s
  accel: 12,               // how fast velocity eases toward target (higher = snappier)
  mouseSensitivity: 0.0022,
  spawn: { x: 0, z: 12.8, yaw: 0 },   // yaw 0 = facing north (-Z), toward the desk
};

// Layout, in metres. North (-Z) = desk end, south (+Z) = entrance.
//   z -14..-10  desk area        z -9..-4  stall row B
//   z  -4.. 2   fountain plaza   z  2.. 7  stall row A
//   z   7..14   entrance hall (pillar)
const HALL = { halfW: 7, halfL: 14, height: 4.2 };
const WALKWAY_HALF_W = 2.5;
const COLORS = {
  floor: 0x7d776c, walkway: 0x9c9483, wall: 0xc9c2b6, ceiling: 0x5e5a53,
  stallWall: 0xd8d1c4, shelf: 0x5a3f2a, stone: 0xa7a296, water: 0x3fa7c4, wood: 0x6b4a2f,
};

if (!window.THREE) {
  logEvent('error', 'Three.js failed to load');
  document.getElementById('overlay').innerHTML = '<p>Three.js failed to load (offline or CDN blocked).</p>';
  throw new Error('THREE not loaded');
}

// =====================================================================
// 2. RENDERER / SCENE / CAMERA
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1d1b);
scene.fog = new THREE.Fog(0x1e1d1b, 16, 48);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
camera.rotation.order = 'YXZ';   // yaw, then pitch: standard FPS ordering

// =====================================================================
// 3. LIGHTING — soft ambient fill + one shadow-casting directional
// =====================================================================
scene.add(new THREE.AmbientLight(0xfff4e6, 0.55));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.6);
sun.position.set(6, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 50 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
scene.add(sun);

// =====================================================================
// 4. BUILD HELPERS — meshes + collision footprints
// =====================================================================
// Colliders are 2D footprints on the XZ plane; height is ignored, so anything
// flagged `collide` blocks the player regardless of how tall it is.
const colliders = { boxes: [], circles: [] };

const matCache = {};
function mat(color, emissive = 0x000000) {
  const key = color + ':' + emissive;
  return matCache[key] || (matCache[key] = new THREE.MeshLambertMaterial({ color, emissive }));
}
function shade(hex, k) { return new THREE.Color(hex).multiplyScalar(k).getHex(); }

function finish(mesh, opts) {
  mesh.castShadow = opts.shadow !== false;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
// Axis-aligned box: (x, z) is the centre of its footprint, y is its BOTTOM.
// opts: { collide, emissive, shadow }
function addBox(w, h, d, x, y, z, color, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts.emissive));
  mesh.position.set(x, y + h / 2, z);
  if (opts.collide) colliders.boxes.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return finish(mesh, opts);
}
// Upright cylinder, y is its BOTTOM. rTop !== rBottom gives a taper/flare.
// opts: { collide, emissive, shadow, segments }
function addCylinder(rTop, rBottom, h, x, y, z, color, opts = {}) {
  const geo = new THREE.CylinderGeometry(rTop, rBottom, h, opts.segments || 24);
  const mesh = new THREE.Mesh(geo, mat(color, opts.emissive));
  mesh.position.set(x, y + h / 2, z);
  if (opts.collide) colliders.circles.push({ x, z, r: Math.max(rTop, rBottom) });
  return finish(mesh, opts);
}

// =====================================================================
// 5. SHELL — floor, walkway, outer walls, ceiling, entrance
// =====================================================================
const W = HALL.halfW, L = HALL.halfL, H = HALL.height, T = 0.3;   // T = wall thickness
addBox(W * 2, 0.1, L * 2, 0, -0.1, 0, COLORS.floor, { shadow: false });
addBox(WALKWAY_HALF_W * 2, 0.01, L * 2, 0, 0, 0, COLORS.walkway, { shadow: false });   // central walkway strip
addBox(W * 2 + T * 2, H, T, 0, 0, -L - T / 2, COLORS.wall, { collide: true, shadow: false });   // north
addBox(W * 2 + T * 2, H, T, 0, 0,  L + T / 2, COLORS.wall, { collide: true, shadow: false });   // south
addBox(T, H, L * 2, -W - T / 2, 0, 0, COLORS.wall, { collide: true, shadow: false });           // west
addBox(T, H, L * 2,  W + T / 2, 0, 0, COLORS.wall, { collide: true, shadow: false });           // east
addBox(W * 2, 0.1, L * 2, 0, H, 0, COLORS.ceiling, { shadow: false });

// Fluorescent strips down the walkway: a continuous line to follow end-to-end
for (let z = -12; z <= 12; z += 4) addBox(0.25, 0.05, 2.4, 0, H - 0.05, z, 0xffffff, { emissive: 0xfff6d8, shadow: false });

// Entrance (fixed anchor): pulled-down shutter set into the south wall
addBox(4, 3, 0.1, 0, 0, L - 0.05, 0x8a8f94, { collide: true, shadow: false });
for (let y = 0.2; y < 3; y += 0.25) addBox(4, 0.03, 0.12, 0, y, L - 0.06, 0x6c7176, { shadow: false });
addBox(4.6, 0.6, 0.2, 0, 3.1, L - 0.1, 0x2f5d8a, { shadow: false });   // header band above shutter

// =====================================================================
// 6. STALLS — three-sided booths open onto the walkway
// =====================================================================
// side: -1 = west, +1 = east. zc: centre along the hall. gapEnd: which end
// (-1 north / +1 south) of the counter is left open to step inside.
function makeStall(side, zc, color, gapEnd) {
  const len = 5, depth = W - WALKWAY_HALF_W;
  const cx = side * (WALKWAY_HALF_W + depth / 2);
  addBox(depth, 0.01, len, cx, 0.01, zc, shade(color, 0.45), { shadow: false });   // floor tint
  for (const dz of [-len / 2, len / 2]) addBox(depth, 2.6, 0.15, cx, 0, zc + dz, COLORS.stallWall, { collide: true });
  // Front counter, leaving ~1.45 m gap at gapEnd
  const counterLen = 3.4, counterX = side * (WALKWAY_HALF_W + 0.4);
  const counterZ = zc - gapEnd * (len / 2 - 0.075 - counterLen / 2);
  addBox(0.6, 1.0, counterLen, counterX, 0, counterZ, shade(color, 0.7), { collide: true });
  // Back shelf against the outer wall
  const shelfX = side * (W - 0.3);
  addBox(0.6, 2.0, 3.6, shelfX, 0, zc, COLORS.shelf, { collide: true });
  // Awning / sign band in the stall's identity colour (overhead, walk-under)
  addBox(0.4, 0.5, len, side * (WALKWAY_HALF_W + 0.2), 2.6, zc, color);
  // Placeholder goods: boxes on the counter and on top of the shelf
  for (let i = -1; i <= 1; i++) {
    addBox(0.3, 0.22, 0.4, counterX, 1.0, counterZ + i * 1.0, shade(color, 1.2 - 0.25 * (i + 1)));
    addBox(0.45, 0.35, 0.8, shelfX, 2.0, zc + i * 1.2, shade(color, 0.55 + 0.2 * (i + 1)));
  }
}
makeStall(-1,  4.5, 0x2a9d8f, -1);   // row A west: teal
makeStall( 1,  4.5, 0xe9c46a, -1);   // row A east: mustard
makeStall(-1, -6.5, 0xe76f51,  1);   // row B west: coral
makeStall( 1, -6.5, 0x7d6bd1,  1);   // row B east: violet

// =====================================================================
// 7. LANDMARKS — fixed anchors that never drift (DESIGN.md §3)
// =====================================================================
// Fountain: centre of the plaza between the two stall rows
const F = { x: 0, z: -1 };
addCylinder(2.9, 2.9, 0.02, F.x, 0, F.z, 0x6e675c, { segments: 48, shadow: false });   // plaza paving ring
addCylinder(1.7, 1.8, 0.55, F.x, 0, F.z, COLORS.stone, { collide: true, segments: 32 }); // basin
addCylinder(1.55, 1.55, 0.02, F.x, 0.55, F.z, COLORS.water, { emissive: 0x0a2a36, segments: 32 });
addCylinder(0.18, 0.25, 1.5, F.x, 0.55, F.z, COLORS.stone);                               // column
addCylinder(0.8, 0.3, 0.3, F.x, 2.0, F.z, COLORS.stone);                                  // upper bowl
addCylinder(0.7, 0.7, 0.02, F.x, 2.3, F.z, COLORS.water, { emissive: 0x0a2a36 });
addCylinder(0.06, 0.1, 0.45, F.x, 2.3, F.z, COLORS.stone);                                // spout

// Vermilion pillar: floor-to-ceiling, glowing lantern band, in the entrance hall
const P = { x: 0, z: 9.5 };
addCylinder(0.75, 0.75, 0.35, P.x, 0, P.z, 0x3a3632, { collide: true, segments: 8 });     // octagonal plinth
addCylinder(0.42, 0.42, H - 0.35, P.x, 0.35, P.z, 0xb3261e, { segments: 16 });
for (const y of [0.9, 3.5]) addCylinder(0.47, 0.47, 0.12, P.x, y, P.z, 0xd4a72c, { segments: 16 });
addCylinder(0.55, 0.55, 0.6, P.x, 2.1, P.z, 0xffe7a3, { emissive: 0xffb84d, segments: 16 });

// =====================================================================
// 8. DESK AREA — the compositing desk at the north end
// =====================================================================
addBox(7, 0.02, 3.6, 0, 0.01, -12, 0x2f4a43, { shadow: false });   // rug marking the area
for (const s of [-1, 1]) {
  addBox(0.15, 1.2, 3.4, s * 3.6, 0, -12.3, COLORS.stallWall, { collide: true });   // framing half-walls
  addBox(0.8, 0.8, 0.8, s * 5.4, 0, -13.2, 0x9b7b52, { collide: true });            // crates in the corners
  addBox(0.7, 0.6, 0.7, s * 5.4, 0.8, -13.2, 0x8a6b45);
}
// Desk: wooden top on four legs, with an inset lightbox panel (the compositing surface)
const DESK = { x: 0, z: -12.2, w: 2.4, d: 1.1, h: 0.78 };
addBox(DESK.w, 0.06, DESK.d, DESK.x, DESK.h - 0.06, DESK.z, COLORS.wood, { collide: true });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  addBox(0.07, DESK.h - 0.06, 0.07, DESK.x + sx * (DESK.w / 2 - 0.08), 0, DESK.z + sz * (DESK.d / 2 - 0.08), shade(COLORS.wood, 0.8));
}
addBox(1.3, 0.02, 0.75, DESK.x, DESK.h, DESK.z, 0xf5efdf, { emissive: 0x5a5448, shadow: false });
addCylinder(0.02, 0.02, 0.55, DESK.x + 0.95, DESK.h, DESK.z - 0.35, 0x3a3632);           // lamp stem
addCylinder(0.06, 0.18, 0.16, DESK.x + 0.95, DESK.h + 0.5, DESK.z - 0.35, 0x2f5d8a);     // lamp shade
// Shelving on the north wall: back panel, three boards, rows of binders
const SHELF_Z = -L + 0.25;
addBox(5, 2.2, 0.1, 0, 0, -L + 0.05, COLORS.shelf);
colliders.boxes.push({ minX: -2.5, maxX: 2.5, minZ: -L, maxZ: -L + 0.5 });   // footprint of the whole unit
const BINDERS = [0x2a9d8f, 0xe76f51, 0x7d6bd1, 0xe9c46a, 0x3a3632, 0xd8d1c4];
for (const y of [0.35, 1.05, 1.75]) {
  addBox(5, 0.04, 0.45, 0, y, SHELF_Z, shade(COLORS.shelf, 1.2));
  for (let i = 0; i < 28; i++) {
    const h = 0.26 + ((i * 7 + y * 10) % 5) * 0.02;
    addBox(0.1, h, 0.34, -2.3 + i * 0.17, y + 0.04, SHELF_Z, BINDERS[(i * 5 + Math.round(y * 3)) % BINDERS.length]);
  }
}

// =====================================================================
// 9. INPUT — pointer lock, mouse look, keyboard
// =====================================================================
const overlay = document.getElementById('overlay');
const keys = new Set();
let locked = false;
let yaw = CONFIG.spawn.yaw, pitch = 0;

overlay.addEventListener('click', () => {
  const p = renderer.domElement.requestPointerLock();
  // newer browsers return a promise and reject if re-locked too quickly after Esc
  if (p && p.catch) p.catch((err) => logEvent('input-warn', 'pointer lock refused (click again)', String(err)));
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', locked);
  if (!locked) keys.clear();
  setFlag('input.pointerLocked', locked);
  logEvent('input', locked ? 'pointer locked' : 'pointer released');
});
document.addEventListener('pointerlockerror', () => logEvent('input-warn', 'pointer lock error (click again)'));
document.addEventListener('mousemove', (e) => {
  if (!locked || Examine.active || Math.abs(e.movementX) > 400) return;   // drop the occasional bogus spike some browsers emit
  yaw -= e.movementX * CONFIG.mouseSensitivity;
  pitch -= e.movementY * CONFIG.mouseSensitivity;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
document.addEventListener('keydown', (e) => { if (locked) keys.add(e.code); });   // e.code = physical key
document.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// =====================================================================
// 10. MOVEMENT & COLLISION
// =====================================================================
const player = { x: CONFIG.spawn.x, z: CONFIG.spawn.z, vx: 0, vz: 0 };
const held = (...codes) => codes.some((c) => keys.has(c));

function updatePlayer(dt) {
  let f = (held('KeyW', 'ArrowUp') ? 1 : 0) - (held('KeyS', 'ArrowDown') ? 1 : 0);
  let s = (held('KeyD', 'ArrowRight') ? 1 : 0) - (held('KeyA', 'ArrowLeft') ? 1 : 0);
  const n = Math.hypot(f, s) || 1;   // no faster on diagonals
  f /= n; s /= n;
  // Forward is -Z at yaw 0, right is +X; rotate both by yaw
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  const tx = (-sin * f + cos * s) * CONFIG.walkSpeed;
  const tz = (-cos * f - sin * s) * CONFIG.walkSpeed;
  const k = 1 - Math.exp(-CONFIG.accel * dt);   // frame-rate-independent easing
  player.vx += (tx - player.vx) * k;
  player.vz += (tz - player.vz) * k;
  player.x += player.vx * dt;
  player.z += player.vz * dt;
  resolveCollisions(player);
}

// Push the player's circle out of every overlapping footprint. Pushing along
// the contact normal (not reverting the move) lets the player slide along walls.
function resolveCollisions(p) {
  const R = CONFIG.playerRadius;
  for (let iter = 0; iter < 3; iter++) {   // a few passes settle corners where colliders meet
    for (const b of colliders.boxes) {
      const dx = p.x - Math.max(b.minX, Math.min(p.x, b.maxX));
      const dz = p.z - Math.max(b.minZ, Math.min(p.z, b.maxZ));
      const d2 = dx * dx + dz * dz;
      if (d2 >= R * R) continue;
      if (d2 > 1e-10) {
        const d = Math.sqrt(d2);
        p.x += (dx / d) * (R - d);
        p.z += (dz / d) * (R - d);
      } else {   // centre ended up inside the box: exit via the nearest face
        const exits = [[b.minX - R - p.x, 0], [b.maxX + R - p.x, 0], [0, b.minZ - R - p.z], [0, b.maxZ + R - p.z]];
        const [ex, ez] = exits.reduce((a, c) => (Math.abs(a[0] + a[1]) <= Math.abs(c[0] + c[1]) ? a : c));
        p.x += ex; p.z += ez;
      }
    }
    for (const c of colliders.circles) {
      const dx = p.x - c.x, dz = p.z - c.z, min = c.r + R;
      const d = Math.hypot(dx, dz);
      if (d >= min) continue;
      const nx = d > 1e-6 ? dx / d : 0, nz = d > 1e-6 ? dz / d : 1;
      p.x = c.x + nx * min;
      p.z = c.z + nz * min;
    }
  }
  checkCollisionHealth(p);
}

// Deepest overlap (metres) between the player circle and any collider; 0 = clear
function penetration(p) {
  const R = CONFIG.playerRadius;
  let worst = 0;
  for (const b of colliders.boxes) {
    const inside = p.x > b.minX && p.x < b.maxX && p.z > b.minZ && p.z < b.maxZ;
    const d = Math.hypot(p.x - Math.max(b.minX, Math.min(p.x, b.maxX)), p.z - Math.max(b.minZ, Math.min(p.z, b.maxZ)));
    worst = Math.max(worst, inside ? R : R - d);
  }
  for (const c of colliders.circles) worst = Math.max(worst, c.r + CONFIG.playerRadius - Math.hypot(p.x - c.x, p.z - c.z));
  return worst;
}

// Collision error reporting: NaN positions get reset to spawn; a player left
// overlapping geometry after resolution logs once per stuck episode.
function checkCollisionHealth(p) {
  if (!Number.isFinite(p.x) || !Number.isFinite(p.z)) {
    logEvent('collision-error', 'non-finite player position, resetting to spawn', { x: p.x, z: p.z });
    Object.assign(p, { x: CONFIG.spawn.x, z: CONFIG.spawn.z, vx: 0, vz: 0 });
    return;
  }
  const depth = penetration(p);
  const stuck = depth > 0.02;
  if (stuck && !getFlag('collision.stuck')) {
    logEvent('collision-error', 'player still overlapping geometry after resolve', { x: +p.x.toFixed(2), z: +p.z.toFixed(2), depth: +depth.toFixed(3) });
    incFlag('collision.stuckCount');
  }
  setFlag('collision.stuck', stuck);
}

// Startup sanity: malformed colliders, and a spawn point inside geometry
colliders.boxes.forEach((b, i) => {
  if (![b.minX, b.maxX, b.minZ, b.maxZ].every(Number.isFinite) || b.minX >= b.maxX || b.minZ >= b.maxZ)
    logEvent('collision-error', `malformed box collider #${i}`, b);
});
colliders.circles.forEach((c, i) => {
  if (![c.x, c.z, c.r].every(Number.isFinite) || c.r <= 0) logEvent('collision-error', `malformed circle collider #${i}`, c);
});
logEvent('world', 'layout built', { meshes: scene.children.length, boxColliders: colliders.boxes.length, circleColliders: colliders.circles.length });
if (penetration(player) > 0) logEvent('collision-error', 'spawn point overlaps geometry', CONFIG.spawn);
setFlag('collision.stuck', false);
setFlag('collision.stuckCount', 0);
setFlag('player.spawned', true);
logEvent('player', 'spawn', { ...CONFIG.spawn });

// =====================================================================
// 11. CELS — pickup & examine
// =====================================================================
// Placeholder cels. Everything except `place` is the object's data and is
// logged as-is, so real cel records can slot in here later.
//   layer: background | character | effects  (what compositing will stack)
//   condition: 0..1 placeholder for DESIGN.md §4.1
const CEL = {
  range: 2.0,              // max look distance to target a cel (metres)
  holdDistance: 0.42,      // how far in front of the eye it's held
  turnSensitivity: 0.004,  // radians per pixel of mouse movement while examining
  lerpRate: 9,             // fly-to-hand / fly-back speed
};
const CEL_DEFS = [
  { id: 'cel-01', cut: 'C-014', layer: 'character', condition: 0.8, origin: 'stamped: Studio Hoshino (?)', foundAt: 'teal stall counter',
    paper: '#f3eee2', ink: '#e76f51', place: { x: -2.9, y: 1.006, z: 4.725, rx: -Math.PI / 2, ry: Math.PI / 2 } },
  { id: 'cel-02', cut: 'C-102', layer: 'background', condition: 0.55, origin: 'no stamp', foundAt: 'violet stall counter',
    paper: '#cfe3f0', ink: '#2f5d8a', place: { x: 2.9, y: 1.006, z: -7.725, rx: -Math.PI / 2, ry: -Math.PI / 2 } },
  { id: 'cel-03', cut: 'C-0??', layer: 'effects', condition: 0.3, origin: 'handwritten: "Hoshino-Ga"', foundAt: 'mustard stall, leaning on shelf',
    paper: '#d9ecc8', ink: '#6a4c93', place: { x: 6.36, y: 0.13, z: 4.0, rx: -0.25, ry: -Math.PI / 2 } },
];

// Procedural placeholder art: a motif per layer type, peg holes, cut number
function makeCelTexture(def) {
  const c = document.createElement('canvas');
  c.width = 320; c.height = 260;
  const g = c.getContext('2d');
  g.fillStyle = def.paper; g.fillRect(0, 0, 320, 260);
  g.fillStyle = g.strokeStyle = def.ink; g.lineWidth = 6;
  if (def.layer === 'background') {          // horizon, hills, a sun
    g.fillRect(0, 170, 320, 90);
    g.beginPath(); g.ellipse(90, 175, 120, 50, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.arc(240, 90, 28, 0, Math.PI * 2); g.stroke();
  } else if (def.layer === 'character') {    // a head-and-shoulders figure
    g.beginPath(); g.arc(160, 110, 42, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(160, 230, 80, 60, 0, Math.PI, 0); g.fill();
  } else {                                   // effects: radiating burst lines
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      g.beginPath(); g.moveTo(160 + Math.cos(a) * 30, 135 + Math.sin(a) * 30);
      g.lineTo(160 + Math.cos(a) * 110, 135 + Math.sin(a) * 90); g.stroke();
    }
  }
  g.fillStyle = '#1e1d1b';                   // registration peg holes along the top
  for (const x of [80, 240]) { g.beginPath(); g.ellipse(x, 18, 18, 6, 0, 0, Math.PI * 2); g.fill(); }
  g.beginPath(); g.arc(160, 18, 8, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1e1d1b';
  g.font = 'bold 22px monospace'; g.fillText(def.cut, 14, 246);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Build the meshes. Phong (not Lambert) so turning a cel shows a sheen off
// the directional light, like acetate catching a lamp.
const cels = CEL_DEFS.map((def) => {
  const { place, paper, ink, ...props } = def;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.26),
    new THREE.MeshPhongMaterial({ map: makeCelTexture(def), side: THREE.DoubleSide, shininess: 80, specular: 0x555555 }));
  mesh.position.set(place.x, place.y, place.z);
  mesh.rotation.set(place.rx, place.ry, 0, 'YXZ');
  mesh.receiveShadow = true;
  mesh.userData = { cel: true, props, state: 'rest', homePos: mesh.position.clone(), homeQuat: mesh.quaternion.clone() };
  scene.add(mesh);
  return mesh;
});

const Examine = { active: false, cel: null, target: null, rotX: 0, rotY: 0, startedAt: 0, sawBack: false };
const raycaster = new THREE.Raycaster();
const SCREEN_CENTRE = new THREE.Vector2(0, 0);
const promptEl = document.getElementById('prompt');
const crosshairEl = document.getElementById('crosshair');
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ');

function beginExamine(cel) {
  const d = cel.userData.props;
  const firstTime = !getFlag(`examined:${d.id}`, false);
  Object.assign(Examine, { active: true, cel, target: null, rotX: 0, rotY: 0, startedAt: performance.now(), sawBack: false });
  cel.userData.state = 'held';
  cel.material.depthTest = false;   // draw over walls so it never clips while held
  cel.renderOrder = 999;
  player.vx = player.vz = 0;        // no drift once walking resumes
  setFlag(`examined:${d.id}`, true);
  setFlag('cel.inHand', d.id);
  logEvent('cel', `picked up ${d.id}`, { ...d, firstTime });
}

function endExamine(reason) {
  const cel = Examine.cel, d = cel.userData.props;
  cel.userData.state = 'returning';
  Examine.active = false;
  Examine.cel = null;
  setFlag('cel.inHand', null);
  logEvent('cel', `put back ${d.id}`, {
    id: d.id, cut: d.cut, origin: d.origin,
    heldSeconds: +((performance.now() - Examine.startedAt) / 1000).toFixed(1),
    sawBack: Examine.sawBack, reason,
  });
}

// While examining, mouse turns the cel instead of the head
document.addEventListener('mousemove', (e) => {
  if (!locked || !Examine.active || Math.abs(e.movementX) > 400) return;
  Examine.rotY += e.movementX * CEL.turnSensitivity;
  Examine.rotX = Math.max(-1.3, Math.min(1.3, Examine.rotX + e.movementY * CEL.turnSensitivity));
  if (Math.abs(Math.atan2(Math.sin(Examine.rotY), Math.cos(Examine.rotY))) > Math.PI / 2) Examine.sawBack = true;
});
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'KeyE' && locked) {
    if (Examine.active) endExamine('key');
    else if (Examine.target) beginExamine(Examine.target);
  } else if (e.code === 'Escape' && Examine.active) endExamine('escape');
});
// Most browsers swallow Esc to release pointer lock, so treat that as "put it back" too
document.addEventListener('pointerlockchange', () => { if (!locked && Examine.active) endExamine('pointer released'); });

function updateCels(dt) {
  const k = 1 - Math.exp(-CEL.lerpRate * dt);
  camera.updateMatrixWorld();
  for (const cel of cels) {
    const u = cel.userData;
    if (u.state === 'held') {
      _v.set(0, 0, -CEL.holdDistance).applyQuaternion(camera.quaternion).add(camera.position);
      _q.setFromEuler(_e.set(Examine.rotX, Examine.rotY, 0)).premultiply(camera.quaternion);
      cel.position.lerp(_v, k);
      cel.quaternion.slerp(_q, k);
    } else if (u.state === 'returning') {
      cel.position.lerp(u.homePos, k);
      cel.quaternion.slerp(u.homeQuat, k);
      if (cel.position.distanceTo(u.homePos) < 0.002) {
        cel.position.copy(u.homePos);
        cel.quaternion.copy(u.homeQuat);
        cel.material.depthTest = true;
        cel.renderOrder = 0;
        u.state = 'rest';
      }
    }
  }
  // Look targeting: nearest thing under the crosshair, if it's a resting cel in range
  Examine.target = null;
  if (locked && !Examine.active) {
    raycaster.setFromCamera(SCREEN_CENTRE, camera);
    raycaster.far = CEL.range;
    const hit = raycaster.intersectObjects(scene.children, false)[0];
    if (hit && hit.object.userData.cel && hit.object.userData.state === 'rest') Examine.target = hit.object;
  }
  const text = Examine.active ? 'Mouse: turn  ·  [E] put back' : Examine.target ? '[E] Examine' : '';
  if (promptEl.textContent !== text) promptEl.textContent = text;
  promptEl.classList.toggle('show', text !== '');
  crosshairEl.style.display = Examine.active ? 'none' : '';
}
logEvent('world', 'cels placed', CEL_DEFS.map((d) => d.id));

// =====================================================================
// 12. SATCHEL — carrying cels, dropping them, and the desk's layer stack
// =====================================================================
// A cel mesh's userData.state, across sections 11 and 12:
//   rest (in the world, examinable) · held · returning      <- section 11
//   carried (in the satchel, removed from the scene)          <- here
//   onDesk (a layer on the desk's lightbox)                   <- here
// All state lives on the meshes and the two objects below, so it persists for
// the whole session wherever the player walks.
// Extension points (not built yet): per-cel condition/decay would tick over
// Satchel.items; capacity upgrades just raise Satchel.capacity.
const SATCHEL_CAPACITY = 4;
const Satchel = { capacity: SATCHEL_CAPACITY, items: [], selected: 0, hudOpen: false, flashUntil: 0 };
const Desk = { layers: [], target: false, targetCel: null };   // layers: bottom -> top
const satchelEl = document.getElementById('satchel');
const toastEl = document.getElementById('toast');
let toastTimer = 0;

const idOf = (cel) => cel.userData.props.id;
const defOf = (cel) => CEL_DEFS.find((d) => d.id === idOf(cel));
const contents = () => Satchel.items.map(idOf);
const selectedCel = () => Satchel.items[Satchel.selected];

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function flashHud() { Satchel.flashUntil = performance.now() + 2000; }

// Single funnel for every satchel/desk state change: flags, log, HUD
function satchelChanged(message, cel, extra) {
  Satchel.selected = Math.max(0, Math.min(Satchel.selected, Satchel.items.length - 1));
  setFlag('satchelCount', Satchel.items.length);
  setFlag('deskLayers', Desk.layers.map(idOf).join(', ') || '(empty)');
  logEvent('satchel', message, { id: idOf(cel), ...extra, contents: contents() });
  renderSatchelHud();
}

// Returns false (and says so on screen) if full
function addToSatchel(cel, source) {
  if (Satchel.items.length >= Satchel.capacity) {
    showToast('Your hands are full.');
    flashHud();
    logEvent('satchel', `take blocked (full): ${idOf(cel)}`, { id: idOf(cel), source, contents: contents() });
    return false;
  }
  scene.remove(cel);
  cel.userData.state = 'carried';
  cel.material.depthTest = true;
  cel.renderOrder = 0;
  Satchel.items.push(cel);
  Satchel.selected = Satchel.items.length - 1;
  flashHud();
  satchelChanged(`took ${idOf(cel)}`, cel, { source });
  return true;
}

// [F] while examining: the held cel goes straight into the satchel
function takeHeld() {
  if (!addToSatchel(Examine.cel, 'examine')) return;   // stays in hand if full
  Examine.active = false;
  Examine.cel = null;
  setFlag('cel.inHand', null);
}

// [G]: the selected cel lands face-up at the player's feet, as an ordinary
// world cel again (its "home" becomes this spot, so examine returns it here)
function dropSelected() {
  const cel = selectedCel();
  if (!cel) return;
  Satchel.items.splice(Satchel.selected, 1);
  cel.position.set(player.x - Math.sin(yaw) * 0.1, 0.035, player.z - Math.cos(yaw) * 0.1);
  cel.rotation.set(-Math.PI / 2, yaw + (Math.random() - 0.5) * 0.6, 0, 'YXZ');
  cel.userData.homePos.copy(cel.position);
  cel.userData.homeQuat.copy(cel.quaternion);
  cel.userData.state = 'rest';
  scene.add(cel);
  flashHud();
  satchelChanged(`dropped ${idOf(cel)}`, cel, { at: { x: +cel.position.x.toFixed(2), z: +cel.position.z.toFixed(2) } });
}

// Desk: only carried cels can become layers. Layers fan out slightly across
// the lightbox so each stays visible (the real composite view comes later).
function layoutDesk() {
  Desk.layers.forEach((cel, i) => {
    cel.position.set(DESK.x - 0.36 + (i % 5) * 0.18, DESK.h + 0.023 + i * 0.002, DESK.z - 0.03 + (i % 2) * 0.06);
    cel.rotation.set(-Math.PI / 2, 0, 0, 'YXZ');
  });
}
function placeSelectedOnDesk() {
  const cel = selectedCel();
  if (!cel) return;
  Satchel.items.splice(Satchel.selected, 1);
  cel.userData.state = 'onDesk';
  Desk.layers.push(cel);
  scene.add(cel);
  layoutDesk();
  satchelChanged(`placed ${idOf(cel)} at desk`, cel, { layer: cel.userData.props.layer, layerIndex: Desk.layers.length - 1 });
}
function takeFromDesk(cel) {
  const i = Desk.layers.indexOf(cel);
  Desk.layers.splice(i, 1);
  if (!addToSatchel(cel, 'desk')) { Desk.layers.splice(i, 0, cel); return; }   // full: leave it on the desk
  layoutDesk();
}

function selectSlot(i) {
  if (i < 0 || i >= Satchel.items.length) return;
  Satchel.selected = i;
  flashHud();
  renderSatchelHud();
}

function renderSatchelHud() {
  satchelEl.innerHTML = '';
  for (let i = 0; i < Satchel.capacity; i++) {
    const cel = Satchel.items[i];
    const slot = document.createElement('div');
    slot.className = 'slot' + (cel && i === Satchel.selected ? ' selected' : '');
    slot.innerHTML = `<span class="key">${i + 1}</span>`;
    if (cel) {
      const def = defOf(cel);
      slot.style.background = def.paper;
      slot.innerHTML += `<span class="dot" style="background:${def.ink}"></span><span class="cut">${def.cut}</span>`;
    }
    satchelEl.appendChild(slot);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Tab') {   // keep Tab from moving browser focus
    e.preventDefault();
    if (!e.repeat) { Satchel.hudOpen = !Satchel.hudOpen; renderSatchelHud(); }
    return;
  }
  if (!locked || e.repeat) return;
  if (Examine.active) { if (e.code === 'KeyF') takeHeld(); return; }
  // (E on a world cel is handled by section 11; the targets below never overlap it)
  if (e.code === 'KeyG') dropSelected();
  else if (e.code === 'KeyE' && Desk.targetCel) takeFromDesk(Desk.targetCel);
  else if (e.code === 'KeyE' && Desk.target) placeSelectedOnDesk();
  else if (/^Digit[1-9]$/.test(e.code)) selectSlot(+e.code.slice(5) - 1);
});
document.addEventListener('wheel', (e) => {
  if (!locked || Examine.active || !Satchel.items.length) return;
  const n = Satchel.items.length;
  selectSlot((Satchel.selected + (e.deltaY > 0 ? 1 : -1) + n) % n);
});

// Per frame: desk targeting, prompt text, HUD visibility. Runs after
// updateCels(), so its prompt takes precedence where they overlap.
function updateSatchel() {
  Desk.target = false;
  Desk.targetCel = null;
  if (locked && !Examine.active) {
    raycaster.setFromCamera(SCREEN_CENTRE, camera);
    raycaster.far = CEL.range;
    const hit = raycaster.intersectObjects(scene.children, false)[0];
    if (hit && hit.object.userData.state === 'onDesk') Desk.targetCel = hit.object;
    else if (hit && Math.abs(hit.point.x - DESK.x) <= DESK.w / 2 && Math.abs(hit.point.z - DESK.z) <= DESK.d / 2 &&
             hit.point.y > DESK.h - 0.1) Desk.target = true;
  }
  let text = null;
  if (Examine.active) text = 'Mouse: turn  ·  [E] put back  ·  [F] take';
  else if (Desk.targetCel) text = `[E] Take back ${Desk.targetCel.userData.props.cut}`;
  else if (Desk.target) text = selectedCel()
    ? `[E] Place ${selectedCel().userData.props.cut} on desk  ·  [1-${Satchel.capacity}] choose`
    : 'Nothing in the satchel to lay out';
  if (text !== null) {
    if (promptEl.textContent !== text) promptEl.textContent = text;
    promptEl.classList.add('show');
  }
  const show = Satchel.hudOpen || Desk.target || Desk.targetCel || performance.now() < Satchel.flashUntil;
  satchelEl.classList.toggle('show', !!show);
}

setFlag('satchelCount', 0);
setFlag('deskLayers', '(empty)');
renderSatchelHud();

// =====================================================================
// 13. MAIN LOOP
// =====================================================================
const clock = new THREE.Clock();
const hud = document.getElementById('hud');

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp so a stalled tab can't tunnel through walls
  if (!Examine.active) updatePlayer(dt);   // examining pauses walking
  camera.position.set(player.x, CONFIG.eyeHeight, player.z);
  camera.rotation.set(pitch, yaw, 0);
  updateCels(dt);
  updateSatchel();
  hud.textContent = `x ${player.x.toFixed(1)}  z ${player.z.toFixed(1)}`;   // playtest readout
  renderer.render(scene, camera);
}
frame();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
