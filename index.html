<pre id="devlog"></pre>

<script>
// =====================================================================
// 0. DEV LOG & FLAGS — shared, in-memory, used by every later system
// =====================================================================
// Loaded before Three.js so it works (and records the failure) even if the
// CDN load fails. Everything here is global on purpose: poke it from the
// console as DevLog.events / DevLog.flags.
//   logEvent(category, message, data?)  timestamped, stored, echoed to console
//   setFlag(name, value) / getFlag(name, fallback?) / incFlag(name, by?)
// Press ` (backquote / ~ key) to toggle the on-screen overlay.
const DevLog = {
  events: [],        // every event this session, oldest first (never trimmed)
  flags: {},         // discrete state: booleans, counters, strings
  t0: performance.now(),
  visible: false,
  dirty: true,       // overlay needs a redraw
  MAX_SHOWN: 15,
};

function logEvent(category, message, data) {
  const e = { t: (performance.now() - DevLog.t0) / 1000, time: new Date().toISOString(), category, message, data };
  DevLog.events.push(e);
  DevLog.dirty = true;
  const print = /error|warn/i.test(category) ? console.warn : console.log;
  print(`[${e.t.toFixed(2)}s] [${category}] ${message}`, ...(data === undefined ? [] : [data]));
  return e;
}
function setFlag(name, value) {
  const prev = DevLog.flags[name];
  DevLog.flags[name] = value;
  if (prev !== value) DevLog.dirty = true;
  return prev;
}
function getFlag(name, fallback) {
  return name in DevLog.flags ? DevLog.flags[name] : fallback;
}
function incFlag(name, by = 1) {   // convenience for counters (e.g. resonance tallies)
  return setFlag(name, getFlag(name, 0) + by);
}

// Overlay: redrawn at most ~10x/s, and only while open and something changed
function renderDevLog() {
  if (!DevLog.visible || !DevLog.dirty) return;
  DevLog.dirty = false;
  const fmt = (v) => (typeof v === 'string' ? v : JSON.stringify(v));
  const flagLines = Object.keys(DevLog.flags).sort().map((k) => `  ${k} = ${fmt(DevLog.flags[k])}`);
  const eventLines = DevLog.events.slice(-DevLog.MAX_SHOWN).map((e) =>
    `  ${e.t.toFixed(2).padStart(7)}s  [${e.category}] ${e.message}${e.data === undefined ? '' : '  ' + fmt(e.data)}`);
  const el = document.getElementById('devlog');
  el.textContent =
    `FLAGS (${flagLines.length})\n${flagLines.join('\n') || '  (none)'}\n\n` +
    `EVENTS (last ${eventLines.length} of ${DevLog.events.length})\n${eventLines.join('\n') || '  (none)'}` +
    (DevLog.footer ? `\n\n${DevLog.footer}` : '');
  el.scrollTop = el.scrollHeight;   // if it overflows, keep the newest events in view
}
setInterval(renderDevLog, 100);

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Backquote') return;
  DevLog.visible = !DevLog.visible;
  DevLog.dirty = true;
  document.getElementById('devlog').classList.toggle('open', DevLog.visible);
  renderDevLog();
});

// Anything that throws later (including in the render loop) lands in the log
window.addEventListener('error', (e) => logEvent('error', e.message, { src: e.filename, line: e.lineno }));
window.addEventListener('unhandledrejection', (e) => logEvent('error', 'unhandled rejection', String(e.reason)));
logEvent('system', 'dev log ready');
</script>

<!-- Three.js r128, pinned UMD build (exposes global THREE). See DESIGN.md §9. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// =====================================================================
// 1. CONFIG — tuning knobs for "does walking feel right?"
// =====================================================================
const CONFIG = {
  eyeHeight: 1.6,          // metres
  playerRadius: 0.3,       // collision radius in the XZ plane
  walkSpeed: 3.0,          // m/s
  accel: 12,               // how fast velocity eases toward target (higher = snappier)
  mouseSensitivity: 0.0022,
  spawn: { x: 0, z: 12.8, yaw: 0 },   // yaw 0 = facing north (-Z), toward the desk
};

// Layout, in metres. North (-Z) = desk end, south (+Z) = entrance.
//   z -14..-10  desk area        z -9..-4  stall row B
//   z  -4.. 2   fountain plaza   z  2.. 7  stall row A
//   z   7..14   entrance hall (pillar)
const HALL = { halfW: 7, halfL: 14, height: 4.2 };
const WALKWAY_HALF_W = 2.5;
const COLORS = {
  floor: 0x7d776c, walkway: 0x9c9483, wall: 0xc9c2b6, ceiling: 0x5e5a53,
  stallWall: 0xd8d1c4, shelf: 0x5a3f2a, stone: 0xa7a296, water: 0x3fa7c4, wood: 0x6b4a2f,
};

if (!window.THREE) {
  logEvent('error', 'Three.js failed to load');
  document.getElementById('overlay').innerHTML = '<p>Three.js failed to load (offline or CDN blocked).</p>';
  throw new Error('THREE not loaded');
}

// =====================================================================
// 2. RENDERER / SCENE / CAMERA
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1d1b);
scene.fog = new THREE.Fog(0x1e1d1b, 16, 48);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
camera.rotation.order = 'YXZ';   // yaw, then pitch: standard FPS ordering

// =====================================================================
// 3. LIGHTING — soft ambient fill + one shadow-casting directional
// =====================================================================
scene.add(new THREE.AmbientLight(0xfff4e6, 0.55));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.6);
sun.position.set(6, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 50 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
scene.add(sun);

// =====================================================================
// 4. BUILD HELPERS — meshes + collision footprints
// =====================================================================
// Colliders are 2D footprints on the XZ plane; height is ignored, so anything
// flagged `collide` blocks the player regardless of how tall it is.
const colliders = { boxes: [], circles: [] };

const matCache = {};
function mat(color, emissive = 0x000000) {
  const key = color + ':' + emissive;
  return matCache[key] || (matCache[key] = new THREE.MeshLambertMaterial({ color, emissive }));
}
function shade(hex, k) { return new THREE.Color(hex).multiplyScalar(k).getHex(); }

function finish(mesh, opts) {
  mesh.castShadow = opts.shadow !== false;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
// Axis-aligned box: (x, z) is the centre of its footprint, y is its BOTTOM.
// opts: { collide, emissive, shadow }
function addBox(w, h, d, x, y, z, color, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts.emissive));
  mesh.position.set(x, y + h / 2, z);
  if (opts.collide) colliders.boxes.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return finish(mesh, opts);
}
// Upright cylinder, y is its BOTTOM. rTop !== rBottom gives a taper/flare.
// opts: { collide, emissive, shadow, segments }
function addCylinder(rTop, rBottom, h, x, y, z, color, opts = {}) {
  const geo = new THREE.CylinderGeometry(rTop, rBottom, h, opts.segments || 24);
  const mesh = new THREE.Mesh(geo, mat(color, opts.emissive));
  mesh.position.set(x, y + h / 2, z);
  if (opts.collide) colliders.circles.push({ x, z, r: Math.max(rTop, rBottom) });
  return finish(mesh, opts);
}

// =====================================================================
// 5. SHELL — floor, walkway, outer walls, ceiling, entrance
// =====================================================================
const W = HALL.halfW, L = HALL.halfL, H = HALL.height, T = 0.3;   // T = wall thickness
addBox(W * 2, 0.1, L * 2, 0, -0.1, 0, COLORS.floor, { shadow: false });
addBox(WALKWAY_HALF_W * 2, 0.01, L * 2, 0, 0, 0, COLORS.walkway, { shadow: false });   // central walkway strip
addBox(W * 2 + T * 2, H, T, 0, 0, -L - T / 2, COLORS.wall, { collide: true, shadow: false });   // north
addBox(W * 2 + T * 2, H, T, 0, 0,  L + T / 2, COLORS.wall, { collide: true, shadow: false });   // south
addBox(T, H, L * 2, -W - T / 2, 0, 0, COLORS.wall, { collide: true, shadow: false });           // west
addBox(T, H, L * 2,  W + T / 2, 0, 0, COLORS.wall, { collide: true, shadow: false });           // east
addBox(W * 2, 0.1, L * 2, 0, H, 0, COLORS.ceiling, { shadow: false });

// Fluorescent strips down the walkway: a continuous line to follow end-to-end
for (let z = -12; z <= 12; z += 4) addBox(0.25, 0.05, 2.4, 0, H - 0.05, z, 0xffffff, { emissive: 0xfff6d8, shadow: false });

// Entrance (fixed anchor): pulled-down shutter set into the south wall
addBox(4, 3, 0.1, 0, 0, L - 0.05, 0x8a8f94, { collide: true, shadow: false });
for (let y = 0.2; y < 3; y += 0.25) addBox(4, 0.03, 0.12, 0, y, L - 0.06, 0x6c7176, { shadow: false });
addBox(4.6, 0.6, 0.2, 0, 3.1, L - 0.1, 0x2f5d8a, { shadow: false });   // header band above shutter

// =====================================================================
// 6. STALLS — three-sided booths open onto the walkway
// =====================================================================
// side: -1 = west, +1 = east. zc: centre along the hall. gapEnd: which end
// (-1 north / +1 south) of the counter is left open to step inside.
function makeStall(side, zc, color, gapEnd) {
  const len = 5, depth = W - WALKWAY_HALF_W;
  const cx = side * (WALKWAY_HALF_W + depth / 2);
  addBox(depth, 0.01, len, cx, 0.01, zc, shade(color, 0.45), { shadow: false });   // floor tint
  for (const dz of [-len / 2, len / 2]) addBox(depth, 2.6, 0.15, cx, 0, zc + dz, COLORS.stallWall, { collide: true });
  // Front counter, leaving ~1.45 m gap at gapEnd
  const counterLen = 3.4, counterX = side * (WALKWAY_HALF_W + 0.4);
  const counterZ = zc - gapEnd * (len / 2 - 0.075 - counterLen / 2);
  addBox(0.6, 1.0, counterLen, counterX, 0, counterZ, shade(color, 0.7), { collide: true });
  // Back shelf against the outer wall
  const shelfX = side * (W - 0.3);
  addBox(0.6, 2.0, 3.6, shelfX, 0, zc, COLORS.shelf, { collide: true });
  // Awning / sign band in the stall's identity colour (overhead, walk-under)
  addBox(0.4, 0.5, len, side * (WALKWAY_HALF_W + 0.2), 2.6, zc, color);
  // Placeholder goods: boxes on the counter and on top of the shelf
  for (let i = -1; i <= 1; i++) {
    addBox(0.3, 0.22, 0.4, counterX, 1.0, counterZ + i * 1.0, shade(color, 1.2 - 0.25 * (i + 1)));
    addBox(0.45, 0.35, 0.8, shelfX, 2.0, zc + i * 1.2, shade(color, 0.55 + 0.2 * (i + 1)));
  }
}
makeStall(-1,  4.5, 0x2a9d8f, -1);   // row A west: teal
makeStall( 1,  4.5, 0xe9c46a, -1);   // row A east: mustard
makeStall(-1, -6.5, 0xe76f51,  1);   // row B west: coral
makeStall( 1, -6.5, 0x7d6bd1,  1);   // row B east: violet

// =====================================================================
// 7. LANDMARKS — fixed anchors that never drift (DESIGN.md §3)
// =====================================================================
// Fountain: centre of the plaza between the two stall rows
const F = { x: 0, z: -1 };
addCylinder(2.9, 2.9, 0.02, F.x, 0, F.z, 0x6e675c, { segments: 48, shadow: false });   // plaza paving ring
addCylinder(1.7, 1.8, 0.55, F.x, 0, F.z, COLORS.stone, { collide: true, segments: 32 }); // basin
addCylinder(1.55, 1.55, 0.02, F.x, 0.55, F.z, COLORS.water, { emissive: 0x0a2a36, segments: 32 });
addCylinder(0.18, 0.25, 1.5, F.x, 0.55, F.z, COLORS.stone);                               // column
addCylinder(0.8, 0.3, 0.3, F.x, 2.0, F.z, COLORS.stone);                                  // upper bowl
addCylinder(0.7, 0.7, 0.02, F.x, 2.3, F.z, COLORS.water, { emissive: 0x0a2a36 });
addCylinder(0.06, 0.1, 0.45, F.x, 2.3, F.z, COLORS.stone);                                // spout

// Vermilion pillar: floor-to-ceiling, glowing lantern band, in the entrance hall
const P = { x: 0, z: 9.5 };
addCylinder(0.75, 0.75, 0.35, P.x, 0, P.z, 0x3a3632, { collide: true, segments: 8 });     // octagonal plinth
addCylinder(0.42, 0.42, H - 0.35, P.x, 0.35, P.z, 0xb3261e, { segments: 16 });
for (const y of [0.9, 3.5]) addCylinder(0.47, 0.47, 0.12, P.x, y, P.z, 0xd4a72c, { segments: 16 });
addCylinder(0.55, 0.55, 0.6, P.x, 2.1, P.z, 0xffe7a3, { emissive: 0xffb84d, segments: 16 });

// =====================================================================
// 8. DESK AREA — the compositing desk at the north end
// =====================================================================
addBox(7, 0.02, 3.6, 0, 0.01, -12, 0x2f4a43, { shadow: false });   // rug marking the area
for (const s of [-1, 1]) {
  addBox(0.15, 1.2, 3.4, s * 3.6, 0, -12.3, COLORS.stallWall, { collide: true });   // framing half-walls
  addBox(0.8, 0.8, 0.8, s * 5.4, 0, -13.2, 0x9b7b52, { collide: true });            // crates in the corners
  addBox(0.7, 0.6, 0.7, s * 5.4, 0.8, -13.2, 0x8a6b45);
}
// Desk: wooden top on four legs, with an inset lightbox panel (the compositing surface)
const DESK = { x: 0, z: -12.2, w: 2.4, d: 1.1, h: 0.78 };
addBox(DESK.w, 0.06, DESK.d, DESK.x, DESK.h - 0.06, DESK.z, COLORS.wood, { collide: true });
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  addBox(0.07, DESK.h - 0.06, 0.07, DESK.x + sx * (DESK.w / 2 - 0.08), 0, DESK.z + sz * (DESK.d / 2 - 0.08), shade(COLORS.wood, 0.8));
}
const lightbox = addBox(1.3, 0.02, 0.75, DESK.x, DESK.h, DESK.z, 0xf5efdf, { emissive: 0x5a5448, shadow: false });
lightbox.material = lightbox.material.clone();   // own material, so pulsing it touches nothing else
addCylinder(0.02, 0.02, 0.55, DESK.x + 0.95, DESK.h, DESK.z - 0.35, 0x3a3632);           // lamp stem
addCylinder(0.06, 0.18, 0.16, DESK.x + 0.95, DESK.h + 0.5, DESK.z - 0.35, 0x2f5d8a);     // lamp shade
// Shelving on the north wall: back panel, three boards, rows of binders
const SHELF_Z = -L + 0.25;
addBox(5, 2.2, 0.1, 0, 0, -L + 0.05, COLORS.shelf);
colliders.boxes.push({ minX: -2.5, maxX: 2.5, minZ: -L, maxZ: -L + 0.5 });   // footprint of the whole unit
const BINDERS = [0x2a9d8f, 0xe76f51, 0x7d6bd1, 0xe9c46a, 0x3a3632, 0xd8d1c4];
for (const y of [0.35, 1.05, 1.75]) {
  addBox(5, 0.04, 0.45, 0, y, SHELF_Z, shade(COLORS.shelf, 1.2));
  for (let i = 0; i < 28; i++) {
    const h = 0.26 + ((i * 7 + y * 10) % 5) * 0.02;
    addBox(0.1, h, 0.34, -2.3 + i * 0.17, y + 0.04, SHELF_Z, BINDERS[(i * 5 + Math.round(y * 3)) % BINDERS.length]);
  }
}

// =====================================================================
// 9. INPUT — pointer lock, mouse look, keyboard
// =====================================================================
const overlay = document.getElementById('overlay');
const keys = new Set();
let locked = false;
let yaw = CONFIG.spawn.yaw, pitch = 0;

overlay.addEventListener('click', () => {
  const p = renderer.domElement.requestPointerLock();
  // newer browsers return a promise and reject if re-locked too quickly after Esc
  if (p && p.catch) p.catch((err) => logEvent('input-warn', 'pointer lock refused (click again)', String(err)));
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  overlay.classList.toggle('hidden', locked);
  if (!locked) keys.clear();
  setFlag('input.pointerLocked', locked);
  logEvent('input', locked ? 'pointer locked' : 'pointer released');
});
document.addEventListener('pointerlockerror', () => logEvent('input-warn', 'pointer lock error (click again)'));
document.addEventListener('mousemove', (e) => {
  if (!locked || Examine.active || Compose.active || Math.abs(e.movementX) > 400) return;   // drop the occasional bogus spike some browsers emit
  yaw -= e.movementX * CONFIG.mouseSensitivity;
  pitch -= e.movementY * CONFIG.mouseSensitivity;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
document.addEventListener('keydown', (e) => { if (locked) keys.add(e.code); });   // e.code = physical key
document.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// =====================================================================
// 10. MOVEMENT & COLLISION
// =====================================================================
const player = { x: CONFIG.spawn.x, z: CONFIG.spawn.z, vx: 0, vz: 0 };
const held = (...codes) => codes.some((c) => keys.has(c));

function updatePlayer(dt) {
  let f = (held('KeyW', 'ArrowUp') ? 1 : 0) - (held('KeyS', 'ArrowDown') ? 1 : 0);
  let s = (held('KeyD', 'ArrowRight') ? 1 : 0) - (held('KeyA', 'ArrowLeft') ? 1 : 0);
  const n = Math.hypot(f, s) || 1;   // no faster on diagonals
  f /= n; s /= n;
  // Forward is -Z at yaw 0, right is +X; rotate both by yaw
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  const tx = (-sin * f + cos * s) * CONFIG.walkSpeed;
  const tz = (-cos * f - sin * s) * CONFIG.walkSpeed;
  const k = 1 - Math.exp(-CONFIG.accel * dt);   // frame-rate-independent easing
  player.vx += (tx - player.vx) * k;
  player.vz += (tz - player.vz) * k;
  player.x += player.vx * dt;
  player.z += player.vz * dt;
  resolveCollisions(player);
}

// Push the player's circle out of every overlapping footprint. Pushing along
// the contact normal (not reverting the move) lets the player slide along walls.
function resolveCollisions(p) {
  const R = CONFIG.playerRadius;
  for (let iter = 0; iter < 3; iter++) {   // a few passes settle corners where colliders meet
    for (const b of colliders.boxes) {
      const dx = p.x - Math.max(b.minX, Math.min(p.x, b.maxX));
      const dz = p.z - Math.max(b.minZ, Math.min(p.z, b.maxZ));
      const d2 = dx * dx + dz * dz;
      if (d2 >= R * R) continue;
      if (d2 > 1e-10) {
        const d = Math.sqrt(d2);
        p.x += (dx / d) * (R - d);
        p.z += (dz / d) * (R - d);
      } else {   // centre ended up inside the box: exit via the nearest face
        const exits = [[b.minX - R - p.x, 0], [b.maxX + R - p.x, 0], [0, b.minZ - R - p.z], [0, b.maxZ + R - p.z]];
        const [ex, ez] = exits.reduce((a, c) => (Math.abs(a[0] + a[1]) <= Math.abs(c[0] + c[1]) ? a : c));
        p.x += ex; p.z += ez;
      }
    }
    for (const c of colliders.circles) {
      const dx = p.x - c.x, dz = p.z - c.z, min = c.r + R;
      const d = Math.hypot(dx, dz);
      if (d >= min) continue;
      const nx = d > 1e-6 ? dx / d : 0, nz = d > 1e-6 ? dz / d : 1;
      p.x = c.x + nx * min;
      p.z = c.z + nz * min;
    }
  }
  checkCollisionHealth(p);
}

// Deepest overlap (metres) between the player circle and any collider; 0 = clear
function penetration(p) {
  const R = CONFIG.playerRadius;
  let worst = 0;
  for (const b of colliders.boxes) {
    const inside = p.x > b.minX && p.x < b.maxX && p.z > b.minZ && p.z < b.maxZ;
    const d = Math.hypot(p.x - Math.max(b.minX, Math.min(p.x, b.maxX)), p.z - Math.max(b.minZ, Math.min(p.z, b.maxZ)));
    worst = Math.max(worst, inside ? R : R - d);
  }
  for (const c of colliders.circles) worst = Math.max(worst, c.r + CONFIG.playerRadius - Math.hypot(p.x - c.x, p.z - c.z));
  return worst;
}

// Collision error reporting: NaN positions get reset to spawn; a player left
// overlapping geometry after resolution logs once per stuck episode.
function checkCollisionHealth(p) {
  if (!Number.isFinite(p.x) || !Number.isFinite(p.z)) {
    logEvent('collision-error', 'non-finite player position, resetting to spawn', { x: p.x, z: p.z });
    Object.assign(p, { x: CONFIG.spawn.x, z: CONFIG.spawn.z, vx: 0, vz: 0 });
    return;
  }
  const depth = penetration(p);
  const stuck = depth > 0.02;
  if (stuck && !getFlag('collision.stuck')) {
    logEvent('collision-error', 'player still overlapping geometry after resolve', { x: +p.x.toFixed(2), z: +p.z.toFixed(2), depth: +depth.toFixed(3) });
    incFlag('collision.stuckCount');
  }
  setFlag('collision.stuck', stuck);
}

// Startup sanity: malformed colliders, and a spawn point inside geometry
colliders.boxes.forEach((b, i) => {
  if (![b.minX, b.maxX, b.minZ, b.maxZ].every(Number.isFinite) || b.minX >= b.maxX || b.minZ >= b.maxZ)
    logEvent('collision-error', `malformed box collider #${i}`, b);
});
colliders.circles.forEach((c, i) => {
  if (![c.x, c.z, c.r].every(Number.isFinite) || c.r <= 0) logEvent('collision-error', `malformed circle collider #${i}`, c);
});

// Procedural placeholder art: a motif, two peg holes, cut number
const MOTIFS = {

  city(g) {

    g.beginPath(); g.arc(70, 70, 22, 0, Math.PI * 2); g.stroke();
  },
  sea(g, def) {
    g.fillRect(0, 150, 320, 110);

    g.strokeStyle = def.paper; g.lineWidth = 4;

  },

      g.beginPath(); g.moveTo(160 + Math.cos(a) * 30, 135 + Math.sin(a) * 30);

};
function makeCelTexture(def) {
  const c = document.createElement('canvas');
  c.width = 320; c.height = 260;
  const g = c.getContext('2d');
  // Backgrounds are opaque painted boards; character/effects layers are clear
  // acetate (a faint tint + edge), so stacking them composites for free.
  const acetate = def.layer !== 'background';
  g.fillStyle = def.paper;
  g.globalAlpha = acetate ? 0.18 : 1; g.fillRect(0, 0, 320, 260); g.globalAlpha = 1;
  if (acetate) { g.strokeStyle = def.paper; g.lineWidth = 4; g.strokeRect(2, 2, 316, 256); }
  g.fillStyle = g.strokeStyle = def.ink; g.lineWidth = 6;
  g.save(); g.translate(def.dx || 0, 0);   // dx: pose offset, so consecutive cuts in a matched lot move
  MOTIFS[def.motif || { background: 'hills', character: 'bust', effects: 'burst' }[def.layer]](g, def);
  g.restore();
  for (const [hx, hy] of def.holes || CEL_HOLES) {   // the two peg holes, where the data says they are
    g.beginPath(); g.arc((hx / 0.32 + 0.5) * 320, (0.5 - hy / 0.26) * 260, 9, 0, Math.PI * 2);
    g.fillStyle = '#1e1d1b'; g.fill();
    g.strokeStyle = 'rgba(255, 255, 255, 0.8)'; g.lineWidth = 2; g.stroke();
  }
  g.fillStyle = '#1e1d1b';                   // cut number, in a different corner per layer so stacks stay legible
  const [cx, cy] = { background: [14, 246], character: [14, 56], effects: [224, 246] }[def.layer];
  g.font = 'bold 22px monospace'; g.fillText(def.cut, cx, cy);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Build the meshes. Phong (not Lambert) so turning a cel shows a sheen off
// the directional light, like acetate catching a lamp.
const sceneIdOf = (sceneNumber) => `sc-${sceneNumber === '?' ? 'unknown' : sceneNumber}`;
const cels = [];   // every live cel mesh; consumed cels are removed (section 13)
function spawnCel(def) {
  const { place, paper, ink, holes, motif, dx, ...props } = def;
  props.sceneId = sceneIdOf(props.scene);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.26),
    new THREE.MeshPhongMaterial({ map: makeCelTexture(def), side: THREE.DoubleSide, shininess: 80, specular: 0x555555,
                                  transparent: def.layer !== 'background', depthWrite: def.layer === 'background' }));
  mesh.position.set(place.x, place.y, place.z);
  mesh.rotation.set(place.rx, place.ry, 0, 'YXZ');
  mesh.receiveShadow = true;
  mesh.userData = { cel: true, props, holes: holes || CEL_HOLES, state: 'rest', homePos: mesh.position.clone(), homeQuat: mesh.quaternion.clone() };
  scene.add(mesh);
  cels.push(mesh);
  return mesh;
}
CEL_DEFS.forEach(spawnCel);

const Examine = { active: false, cel: null, target: null, rotX: 0, rotY: 0, startedAt: 0, sawBack: false };
const raycaster = new THREE.Raycaster();
const SCREEN_CENTRE = new THREE.Vector2(0, 0);
const promptEl = document.getElementById('prompt');
const crosshairEl = document.getElementById('crosshair');
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ');

function beginExamine(cel) {
  const d = cel.userData.props;
  const firstTime = !getFlag(`examined:${d.id}`, false);
  Object.assign(Examine, { active: true, cel, target: null, rotX: 0, rotY: 0, startedAt: performance.now(), sawBack: false });
  cel.userData.state = 'held';
  cel.material.depthTest = false;   // draw over walls so it never clips while held
  cel.renderOrder = 999;
  player.vx = player.vz = 0;        // no drift once walking resumes
  setFlag(`examined:${d.id}`, true);
  setFlag('cel.inHand', d.id);
  logEvent('cel', `picked up ${d.id}`, { ...d, firstTime });
}

function endExamine(reason) {
  const cel = Examine.cel, d = cel.userData.props;
  cel.userData.state = 'returning';
  Examine.active = false;
  Examine.cel = null;
  setFlag('cel.inHand', null);
  logEvent('cel', `put back ${d.id}`, {
    id: d.id, cut: d.cut, origin: d.origin,
    heldSeconds: +((performance.now() - Examine.startedAt) / 1000).toFixed(1),
    sawBack: Examine.sawBack, reason,
  });
}

// While examining, mouse turns the cel instead of the head
document.addEventListener('mousemove', (e) => {
  if (!locked || !Examine.active || Math.abs(e.movementX) > 400) return;
  Examine.rotY += e.movementX * CEL.turnSensitivity;
  Examine.rotX = Math.max(-1.3, Math.min(1.3, Examine.rotX + e.movementY * CEL.turnSensitivity));
  if (Math.abs(Math.atan2(Math.sin(Examine.rotY), Math.cos(Examine.rotY))) > Math.PI / 2) Examine.sawBack = true;
});
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'KeyE' && locked) {
    if (Examine.active) endExamine('key');
    else if (Examine.target) beginExamine(Examine.target);
  } else if (e.code === 'Escape' && Examine.active) endExamine('escape');
});
// Most browsers swallow Esc to release pointer lock, so treat that as "put it back" too
document.addEventListener('pointerlockchange', () => { if (!locked && Examine.active) endExamine('pointer released'); });

function updateCels(dt) {
  const k = 1 - Math.exp(-CEL.lerpRate * dt);
  camera.updateMatrixWorld();
  for (const cel of cels) {
    const u = cel.userData;
    if (u.state === 'held') {
      _v.set(0, 0, -CEL.holdDistance).applyQuaternion(camera.quaternion).add(camera.position);
      _q.setFromEuler(_e.set(Examine.rotX, Examine.rotY, 0)).premultiply(camera.quaternion);
      cel.position.lerp(_v, k);
      cel.quaternion.slerp(_q, k);
    } else if (u.state === 'returning') {
      cel.position.lerp(u.homePos, k);
      cel.quaternion.slerp(u.homeQuat, k);
      if (cel.position.distanceTo(u.homePos) < 0.002) {
        cel.position.copy(u.homePos);
        cel.quaternion.copy(u.homeQuat);
        cel.material.depthTest = true;
        cel.renderOrder = 0;
        u.state = 'rest';
      }
    }
  }
  // Look targeting: nearest thing under the crosshair, if it's a resting cel in range
  Examine.target = null;
  if (locked && !Examine.active && !Compose.active) {
    raycaster.setFromCamera(SCREEN_CENTRE, camera);
    raycaster.far = CEL.range;
    const hit = raycaster.intersectObjects(scene.children, false)[0];
    if (hit && hit.object.userData.cel && hit.object.userData.state === 'rest') Examine.target = hit.object;
  }
  const text = Examine.active ? 'Mouse: turn  ·  [E] put back' : Examine.target ? '[E] Examine' : '';
  if (promptEl.textContent !== text) promptEl.textContent = text;
  promptEl.classList.toggle('show', text !== '');
  crosshairEl.style.display = Examine.active ? 'none' : '';
}

  active: 0, get layers() { return this.slots[this.active]; }, target: false, targetCel: null,
};

const toastEl = document.getElementById('toast');

const idOf = (cel) => cel.userData.props.id;

function showToast(text) {

// Single funnel for every satchel/desk state change: flags, log, HUD
function satchelChanged(message, cel, extra) {
  Satchel.selected = Math.max(0, Math.min(Satchel.selected, Satchel.items.length - 1));
  setFlag('satchelCount', Satchel.items.length);
  deskChanged();   // section 13: desk flags + continuity check
  logEvent('satchel', message, { id: idOf(cel), ...extra, contents: contents() });
  renderSatchelHud();
}

// Returns false (and says so on screen) if full
function addToSatchel(cel, source) {
  if (Satchel.items.length >= Satchel.capacity) {
    showToast('Your hands are full.');
    flashHud();
    logEvent('satchel', `take blocked (full): ${idOf(cel)}`, { id: idOf(cel), source, contents: contents() });
    return false;
  }
  scene.remove(cel);
  cel.userData.state = 'carried';
  cel.material.depthTest = true;
  cel.renderOrder = 0;
  Satchel.items.push(cel);
  Satchel.selected = Satchel.items.length - 1;
  flashHud();
  satchelChanged(`took ${idOf(cel)}`, cel, { source });
  return true;
}

// [F] while examining: the held cel goes straight into the satchel
function takeHeld() {
  if (!addToSatchel(Examine.cel, 'examine')) return;   // stays in hand if full
  Examine.active = false;
  Examine.cel = null;
  setFlag('cel.inHand', null);
}

// [G]: the selected cel lands face-up at the player's feet, as an ordinary
// world cel again (its "home" becomes this spot, so examine returns it here)
function dropSelected() {
  const cel = selectedCel();
  if (!cel) return;
  Satchel.items.splice(Satchel.selected, 1);
  cel.position.set(player.x - Math.sin(yaw) * 0.1, 0.035, player.z - Math.cos(yaw) * 0.1);
  cel.rotation.set(-Math.PI / 2, yaw + (Math.random() - 0.5) * 0.6, 0, 'YXZ');
  cel.userData.homePos.copy(cel.position);
  cel.userData.homeQuat.copy(cel.quaternion);
  cel.userData.state = 'rest';
  cel.scale.setScalar(1);
  scene.add(cel);
  flashHud();
  satchelChanged(`dropped ${idOf(cel)}`, cel, { at: { x: +cel.position.x.toFixed(2), z: +cel.position.z.toFixed(2) } });
}

// Desk: only carried cels can become layers; they go into the active frame.
// (layoutDesk, which positions every frame's stack, lives in section 13.)
function placeOnDesk(cel) {
  Satchel.items.splice(Satchel.items.indexOf(cel), 1);
  cel.userData.state = 'onDesk';
  Desk.layers.push(cel);
  if (!cel.parent) scene.add(cel);
  layoutDesk();
  satchelChanged(`placed ${idOf(cel)} at desk`, cel, { layer: cel.userData.props.layer, layerIndex: Desk.layers.indexOf(cel) });
}
function takeFromDesk(cel) {   // returns false if the satchel is full (cel stays registered)
  const layers = Desk.slots.find((l) => l.includes(cel)), i = layers.indexOf(cel);
  layers.splice(i, 1);
  if (!addToSatchel(cel, 'desk')) { layers.splice(i, 0, cel); layoutDesk(); return false; }
  layoutDesk();
  return true;
}

// Per frame: desk targeting, prompt text, HUD visibility. Runs after

function updateSatchel() {
  Desk.target = false;

    raycaster.setFromCamera(SCREEN_CENTRE, camera);
    raycaster.far = CEL.range;
    const hit = raycaster.intersectObjects(scene.children, false)[0];
    if (hit && hit.object.userData.state === 'onDesk') Desk.targetCel = hit.object;
    else if (hit && Math.abs(hit.point.x - DESK.x) <= DESK.w / 2 && Math.abs(hit.point.z - DESK.z) <= DESK.d / 2 &&
             hit.point.y > DESK.h - 0.1) Desk.target = true;
  }

  else if (Desk.target || Desk.targetCel) text = '[E] Sit at the desk';

// =====================================================================
// 13. COMPOSITING — desk, scene library, registration, sheets, playback,
//     reels on exit, and cel sourcing (shipment crate + matched lots)
// =====================================================================
// Sitting down: [E] at the desk. The camera glides to a top-down view of the
// lightbox, carried cels are laid on the desk margins (the tray) and the
// mouse drives a hand cursor. Click picks a cel up, click again lets go.
//
// Registration: every cel has two peg holes at fixed spots on its plane
// (userData.holes, painted on its texture). Letting go near the peg bar snaps
// the cel so its hole midpoint sits on the pegs' midpoint and the line
// through its holes lies along the bar. It's computed from the holes, so a
// damaged cel with shifted holes would register shifted/skewed, and
// registerCel() is where a "won't register" failure can go later. For now
// registration always succeeds.
//
// Scene Library: one folder per sceneId the player has placed a cel into,
// shown as folder cards along the back of the lightbox ("Sc 12  2/4").
// Each folder owns an independent exposure sheet. Placing a cel files it
// by its sceneId: into that scene's folder (created on first use), which
// opens. Click a card or [Up]/[Down] to open another folder.
//
// Exposure sheet (per folder): FRAME_SLOTS frames in a row along the front of
// the lightbox, each its own stack (background / character / effects). The
// active frame sits on the pegs at full size; the rest wait as thumbnails.
// [<] [>] (or arrow keys, or clicking a thumbnail) changes the active frame.
// Carrying a registered cel to another frame (switch while holding it, or
// let go over a thumbnail) moves it there.
//
// Playback: [Space] flips from the first to the last filled frame at
// FLIP_FPS, looping. An empty frame in between plays as static: a visible
// hole in the sequence, not an error.
//
// Continuity: cels carry a scene number and tone tag. Nothing stops a
// mismatch; neighbouring filled frames that disagree are only logged
// ("continuity"), never shown in-world.
//
// Reels: no confirm step and no slot-count rule. Standing up from the desk
// completes every folder that has at least one filled frame: its sheet is
// snapshotted as a finished reel (log, reelsCompleted, resonance per cel,
// audio cue, plus a TEMPORARY "REEL COMPLETE" debug banner), then the
// folder is cleared and its cels are consumed (gone, not back to the
// satchel). Empty folders complete nothing.
//
// Sourcing: the east crate stack in the desk area is the shipment crate.
// Whenever it's been empty for SOURCING.restockDelay seconds a shipment
// arrives on it: usually one random cel, occasionally (tune.lotChance) a
// matched lot of 2-4 consecutive character cuts from one scene, tagged with
// a lotId. With the debug overlay open: [ / ] tune lotChance, N forces a
// shipment.
const FRAME_SLOTS = 4;       // exposure-sheet length (3-5)
const FLIP_FPS = 4;          // playback rate, frames per second
const COMPOSE = {
  handSpeed: 0.0011,   // metres of hand travel per pixel of mouse movement
  follow: 16,          // how tightly a held cel trails the hand (higher = snappier)
  lift: 0.05,          // how high a held cel floats above the desk
  magnet: 0.1,         // within this of its registered spot, a held cel is drawn in
  snap: 0.05,          // within this, letting go snaps it into register
  camBlend: 5,         // sit-down / stand-up camera speed
};
const Compose = { active: false, t: 0, cursor: new THREE.Vector3(), held: null, vel: new THREE.Vector3() };
const Reel = { pulse: 0 };   // lightbox glow after reels complete
const Play = { active: false, seq: [], i: 0, t: 0 };
const Continuity = { open: new Set() };   // mismatches currently on the sheet (already logged)
// Scene Library state (folder: { sceneId, label, slots, frame, card, canvas })
const Library = { folders: [], open: null };
const EMPTY_SHEET = Array.from({ length: FRAME_SLOTS }, () => []);   // shown when no folder is open; never filled

// Seated camera: above the lightbox, tilted a little toward the chair side
const deskCamPos = new THREE.Vector3(DESK.x, DESK.h + 1.12, DESK.z + 0.28);
const deskCamQuat = new THREE.Quaternion().setFromRotationMatrix(
  new THREE.Matrix4().lookAt(deskCamPos, new THREE.Vector3(DESK.x, DESK.h, DESK.z + 0.02), new THREE.Vector3(0, 1, 0)));
const FLAT = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0, 'YXZ'));   // face-up, top edge north
const UP = new THREE.Vector3(0, 1, 0);
const _hold = new THREE.Vector3(), _prev = new THREE.Vector3(), _tilt = new THREE.Quaternion(), _te = new THREE.Euler();
const PULSE_COLOR = new THREE.Color(0xfff2c8);

// --- Peg bar: two pegs, spaced and placed to match the standard cel holes
const PEG = { x: REG.x, z: REG.z - CEL_HOLES[0][1], spacing: CEL_HOLES[1][0] - CEL_HOLES[0][0] };
const pegMat = new THREE.MeshLambertMaterial({ color: 0x3a3632, emissive: 0x000000 });
addBox(0.3, 0.004, 0.03, PEG.x, DESK.h + 0.02, PEG.z, 0x3a3632, { shadow: false });
for (const dx of [-PEG.spacing / 2, PEG.spacing / 2]) {

// --- Registration: the pose that puts a cel's two holes onto the two pegs
function registerTransform(cel) {
  const [[x1, y1], [x2, y2]] = cel.userData.holes;
  // Turn the cel so its hole line runs along the bar (+X), face-up...
  const quat = new THREE.Quaternion().setFromAxisAngle(UP, Math.atan2(-(y2 - y1), x2 - x1)).multiply(FLAT);
  // ...then shift it so the midpoint between its holes lands between the pegs
  const mid = new THREE.Vector3((x1 + x2) / 2, (y1 + y2) / 2, 0).applyQuaternion(quat);
  return {
    pos: new THREE.Vector3(PEG.x - mid.x, 0, PEG.z - mid.z), quat,
    spacingError: Math.abs(Math.hypot(x2 - x1, y2 - y1) - PEG.spacing),   // 0 for an undamaged cel
  };
}
function registerCel(cel, frame, extra) {
  const r = registerTransform(cel);
  const snapped = true;   // later: false for damaged cels (e.g. spacingError over a tolerance)
  logEvent('register', `${idOf(cel)} -> frame ${frame + 1}`,
    { id: idOf(cel), frame: frame + 1, snapped, holeSpacingError: +r.spacingError.toFixed(4), ...extra });
  return snapped;
}

// --- Exposure sheet: one marker per frame along the front of the lightbox
const THUMB = { scale: 0.3, pitch: 0.14, z: DESK.z + 0.27 };

const markers = Desk.slots.map((_, s) => {

const thumbCentre = (s) => { const p = markerPos(s); return { x: p.x, z: p.z - 0.014 }; };   // the frame box, above the number

// Static card: what an empty frame looks like during playback
const staticCanvas = document.createElement('canvas');
staticCanvas.width = 80; staticCanvas.height = 65;

staticTex.magFilter = THREE.NearestFilter;
const staticCard = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.26), new THREE.MeshBasicMaterial({ map: staticTex }));
staticCard.position.set(REG.x, DESK.h + 0.04, REG.z);
staticCard.quaternion.copy(FLAT);
staticCard.renderOrder = 60;
staticCard.visible = false;
staticCard.raycast = () => {};
scene.add(staticCard);
function refreshStatic() {

// Every frame's stack gets a target pose (userData.slot/slotQuat/slotScale):
// the active frame registered on the pegs, the others as thumbnails.
// Cels glide there in updateCompose(); teleport=true jumps (playback).
function layoutDesk(teleport) {
  Library.folders.forEach((f, fi) => {   // only the open folder's cels are out on the desk
    for (const cel of f.slots.flat()) {
      if (Compose.held && Compose.held.cel === cel) continue;
      if (f !== Library.open && cel.parent) scene.remove(cel);
      else if (f === Library.open && !cel.parent) {   // slides out of its folder card
        const p = folderCardPos(fi);
        scene.add(cel);
        cel.position.set(p.x, DESK.h + 0.03, p.z);
        cel.scale.setScalar(0.2);
      }
    }
  });
  Desk.slots.forEach((layers, s) => {
    layers.sort((a, b) => LAYER_ORDER[a.userData.props.layer] - LAYER_ORDER[b.userData.props.layer]);
    layers.forEach((cel, i) => {
      const u = cel.userData;
      if (s === Desk.active) {
        const r = registerTransform(cel);
        u.slot = r.pos.setY(DESK.h + 0.026 + i * 0.003);   // just above the peg bar (top at +0.024)
        u.slotQuat = r.quat;
        u.slotScale = 1;
      } else {
        const t = thumbCentre(s);
        u.slot = new THREE.Vector3(t.x, DESK.h + 0.022 + i * 0.001, t.z); u.slotQuat = FLAT; u.slotScale = THUMB.scale;
      }
      cel.renderOrder = 10 + i;   // draw acetate bottom-to-top
      if (teleport && !(Compose.held && Compose.held.cel === cel)) {
        cel.position.copy(u.slot); cel.quaternion.copy(u.slotQuat); cel.scale.setScalar(u.slotScale);
      }

  markers.forEach((m, s) => m.material.color.setHex(!Library.open ? 0x5a5650 : s === Desk.active ? 0xffc86b : 0x8a857c));
}
const frameSummary = () => (Library.open
  ? `${Library.open.sceneId} ` + Desk.slots.map((l, s) => `${s + 1}:${l.map(idOf).join('+') || '-'}`).join('  ')
  : '(no folder open)');
const filledCount = (f) => f.slots.filter((l) => l.length).length;

// Called on every desk change (via satchelChanged, or frame-to-frame moves)
function deskChanged() {
  setFlag('deskLayers', frameSummary());
  setFlag('library', Library.folders.map((f) => `${f.sceneId}:${filledCount(f)}/${FRAME_SLOTS}`).join('  ') || '(empty)');
  layoutFolderCards();

}

// --- Scene Library: folder cards along the back edge of the lightbox
const FOLDER = { w: 0.13, h: 0.085, pitch: 0.15, z: DESK.z - 0.29 };
const folderCardPos = (i) => ({ x: DESK.x + (i - (Library.folders.length - 1) / 2) * FOLDER.pitch, z: FOLDER.z });
const folderFor = (sceneId) => Library.folders.find((f) => f.sceneId === sceneId);
function drawFolderCard(f) {
  const g = f.canvas.getContext('2d'), open = f === Library.open;
  g.clearRect(0, 0, 130, 85);
  g.fillStyle = open ? '#f0cf7a' : '#c9a86a';
  g.fillRect(6, 0, 46, 14);     // tab
  g.fillRect(0, 10, 130, 75);   // body

  g.fillStyle = '#1e1d1b';

  g.font = '19px monospace'; g.fillText(`${filledCount(f)}/${FRAME_SLOTS}`, 10, 72);   // compact preview: frames filled
  f.card.material.map.needsUpdate = true;
}
function layoutFolderCards() {
  Library.folders.forEach((f, i) => {
    const p = folderCardPos(i);
    f.card.position.set(p.x, DESK.h + 0.0205, p.z);

}
function createFolder(sceneId, sceneNumber) {
  const canvas = document.createElement('canvas');
  canvas.width = 130; canvas.height = 85;
  const card = new THREE.Mesh(new THREE.PlaneGeometry(FOLDER.w, FOLDER.h),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
  card.quaternion.copy(FLAT);

  Library.folders.push(f);

}
// keepFrame: stay on the current frame number (used when a placement opens a folder)
function openFolder(f, keepFrame) {
  if (f === Library.open) return;
  if (Play.active) stopPlay('folder change');
  if (Library.open) Library.open.frame = Desk.active;
  Library.open = f;
  if (!keepFrame) Desk.active = f.frame;
  layoutDesk(false);
  deskChanged();
  setFlag('library.open', f.sceneId);
  setFlag('desk.frame', Desk.active + 1);
}
function stepFolder(d) {

  const n = Library.folders.length, i = Library.folders.indexOf(Library.open);
  openFolder(Library.folders[i < 0 ? 0 : (i + d + n) % n]);
}
function folderUnderHand() {
  return Library.folders.find((f) => Math.abs(Compose.cursor.x - f.card.position.x) < FOLDER.w / 2 && Math.abs(Compose.cursor.z - f.card.position.z) < FOLDER.h / 2);
}

// --- Continuity: log (never show) mismatches between neighbouring filled frames
function frameKey(layers) {   // a frame's scene/tone come from its background (else its bottom layer)
  const c = layers.find((l) => l.userData.props.layer === 'background') || layers[0];
  return c && { scene: c.userData.props.scene, tone: c.userData.props.tone, cels: layers.map(idOf) };
}
function checkContinuity() {
  const now = new Set();
  for (let s = 0; s < FRAME_SLOTS - 1; s++) {
    const a = frameKey(Desk.slots[s]), b = frameKey(Desk.slots[s + 1]);
    if (!a || !b) continue;   // only frames side by side that are both filled
    for (const field of ['scene', 'tone']) {
      if (a[field] === b[field]) continue;
      const type = `${field}-mismatch`, key = `${Library.open.sceneId}|${type}|${s}|${a.cels}|${b.cels}`;
      now.add(key);
      if (Continuity.open.has(key)) continue;   // still there from before: already logged
      incFlag('continuity.mismatchEvents');
      logEvent('continuity', type, { folder: Library.open.sceneId, frames: [s + 1, s + 2], [field]: [a[field], b[field]], cels: [a.cels, b.cels] });
    }
  }
  Continuity.open = now;
  setFlag('continuity.openMismatches', now.size);
}

// --- Hand cursor: a ring hovering over the desk (never hit by look raycasts)
const handCursor = new THREE.Mesh(new THREE.RingGeometry(0.01, 0.016, 24),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
handCursor.rotation.x = -Math.PI / 2;
handCursor.renderOrder = 1000;
handCursor.visible = false;
handCursor.raycast = () => {};
scene.add(handCursor);

// --- Tray: satchel cels laid on the desk's side margins while seated
const TRAY = [[-0.93, -0.08], [-0.93, 0.26], [0.93, -0.08], [0.93, 0.26]];   // (x, z) offsets from the desk centre
function layoutTray(teleport) {
  Satchel.items.forEach((cel, i) => {
    const [dx, dz] = TRAY[i % TRAY.length], u = cel.userData;
    u.slot = new THREE.Vector3(DESK.x + dx, DESK.h + 0.004 + Math.floor(i / TRAY.length) * 0.003, DESK.z + dz);
    u.slotQuat = FLAT; u.slotScale = 1;

// --- Sound: WebAudio stand-ins (tick on registering; the reel cue is the placeholder tape-warp)
let audioCtx = null;
function audio() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTick() {
  try {
    const ac = audio(), t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(2200, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.03);
    g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.05);
  } catch (err) { logEvent('audio-warn', 'tick failed', String(err)); }
}
function playReelCue() {   // a falling, wobbling tone: "tape warp" until the real sound exists
  try {
    const ac = audio(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), depth = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(523, t); o.frequency.exponentialRampToValueAtTime(370, t + 1.0);
    lfo.frequency.value = 5.5; depth.gain.value = 10;
    lfo.connect(depth).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    o.connect(g).connect(ac.destination);
    o.start(t); lfo.start(t); o.stop(t + 1.25); lfo.stop(t + 1.25);
  } catch (err) { logEvent('audio-warn', 'reel cue failed', String(err)); }
}

// --- Sitting down / standing up
function enterCompose() {
  Compose.active = true;
  Compose.cursor.set(REG.x, 0, REG.z + 0.18);   // hand starts just below the active frame
  player.vx = player.vz = 0;
  layoutTray(true);
  layoutDesk(false);
  setFlag('desk.seated', true);
  logEvent('desk', 'sat down', { satchel: contents(), frames: frameSummary() });
}
function exitCompose(reason) {
  if (Play.active) stopPlay('stood up');
  if (Compose.held) releaseHeld();   // whatever's in hand resolves as if let go
  Compose.active = false;
  for (const cel of Satchel.items) { scene.remove(cel); cel.scale.setScalar(1); }   // tray cels back into the satchel
  handCursor.visible = false;
  setFlag('desk.seated', false);
  logEvent('desk', 'stood up', { reason, library: getFlag('library') });
  // Leaving the desk completes every folder with something on its sheet
  const done = Library.folders.map(completeFolder).filter(Boolean);
  if (done.length) {
    done.forEach((d, i) => setTimeout(playReelCue, i * 900));
    Reel.pulse = 1;
    showReelBanner(done);
    layoutDesk(false);
    deskChanged();
  }
}

// --- Frames and playback
function selectFrame(s) {
  s = Math.max(0, Math.min(FRAME_SLOTS - 1, s));
  if (Play.active) stopPlay('frame change');
  if (s === Desk.active) return;
  Desk.active = s;
  layoutDesk(false);
  setFlag('desk.frame', s + 1);
}
function showFrame(s) {   // playback: cut straight to frame s (no glide)

  if (staticCard.visible) refreshStatic();
}
function startPlay() {
  const filled = Desk.slots.map((l, s) => (l.length ? s : -1)).filter((s) => s >= 0);
  if (!filled.length) { showToast('Nothing on the sheet to play.'); return; }
  if (Compose.held) releaseHeld();
  Play.seq = [];
  for (let s = filled[0]; s <= filled[filled.length - 1]; s++) Play.seq.push(s);   // interior gaps included
  Object.assign(Play, { active: true, i: 0, t: 0 });
  showFrame(Play.seq[0]);
  setFlag('desk.playing', true);
  logEvent('desk', 'play', { frames: Play.seq.map((s) => s + 1), gaps: Play.seq.filter((s) => !Desk.slots[s].length).map((s) => s + 1) });
}
function stopPlay(reason) {
  Play.active = false;
  staticCard.visible = false;
  layoutDesk(false);
  setFlag('desk.playing', false);
  setFlag('desk.frame', Desk.active + 1);
  logEvent('desk', 'stop', { reason, frame: Desk.active + 1 });
}

// --- Picking up and letting go
const isOver = (cel) => Math.abs(Compose.cursor.x - cel.position.x) < 0.16 && Math.abs(Compose.cursor.z - cel.position.z) < 0.13;

  return [...Desk.layers].reverse().find(isOver) || Satchel.items.find(isOver);
}
function markerUnderHand() {

function grab(cel) {

    fromFrame: Desk.slots.findIndex((l) => l.includes(cel)),
    reg: registerTransform(cel),   // where this cel's holes meet the pegs
    offset: new THREE.Vector3(cel.position.x - Compose.cursor.x, 0, cel.position.z - Compose.cursor.z),   // no jump on pickup

}
// Where the hand is taking the held cel: hand + grab offset, drawn toward its

function holdTarget(out) {
  const { offset, reg } = Compose.held;
  out.set(Compose.cursor.x + offset.x, DESK.h + COMPOSE.lift, Compose.cursor.z + offset.z);
  const d = Math.hypot(out.x - reg.pos.x, out.z - reg.pos.z);
  const pull = d < COMPOSE.magnet ? (1 - d / COMPOSE.magnet) ** 2 * 0.85 : 0;
  out.x += (reg.pos.x - out.x) * pull;
  out.z += (reg.pos.z - out.z) * pull;

}

  Compose.held = null;
  pegMat.emissive.setHex(0x000000);
  if (inRegister) {
    // File by scene: the cel goes to its sceneId's folder (new if needed), which opens
    const { sceneId, scene: sceneNumber } = cel.userData.props;
    const created = !folderFor(sceneId);
    const folder = folderFor(sceneId) || createFolder(sceneId, sceneNumber);
    openFolder(folder, true);
    if (from === 'tray') {
      placeOnDesk(cel);
      layoutTray(false);
      registerCel(cel, Desk.active);
    } else if (fromFrame !== Desk.active) {   // carried across the sheet: moves to this frame
      const old = Desk.slots[fromFrame];
      old.splice(old.indexOf(cel), 1);
      Desk.layers.push(cel);
      layoutDesk(false);
      deskChanged();
      registerCel(cel, Desk.active, { movedFrom: fromFrame + 1 });
    } else { layoutDesk(false); playTick(); return; }   // re-seated where it was: not a new placement
    logEvent('library', `placed ${idOf(cel)} in ${sceneId}`,
      { id: idOf(cel), sceneId, folder: folder.label, frame: Desk.active + 1, newFolder: created, movedFrom: from === 'desk' ? fromFrame + 1 : undefined });
    playTick();

    if (takeFromDesk(cel)) layoutTray(false);   // full satchel: it glides back onto the pegs

  layers: ['background', 'background', 'character', 'character', 'effects'],   // single-draw weighting
  palettes: {
    background: [['#cfe3f0', '#2f5d8a'], ['#f4dcc0', '#8a3b2a'], ['#d6e4ec', '#24506e'], ['#e6efd8', '#4a6b3a']],

const Shipment = { wait: Infinity, count: 0, lots: 0, serial: 0 };   // wait = Infinity: first shipment arrives at once
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function genCelDef(over = {}) {   // the common case: one unrelated cel
  const layer = over.layer || pick(GEN.layers);
  const [paper, ink] = pick(GEN.palettes[layer]);
  return {
    id: nextCelId(), resonance: pick(['care', 'violence']), cut: `C-${100 + Math.floor(Math.random() * 900)}`,
    scene: pick(SOURCING.scenes), tone: pick(['warm', 'cool']), layer, motif: pick(GEN.motifs[layer]),
    condition: +(0.3 + Math.random() * 0.6).toFixed(2), origin: pick(GEN.origins), paper, ink, ...over,

// The rare draw: 2-4 consecutive cuts of one character from one scene. Same

// (dx) advance, so they flip as motion on a sheet.
function genMatchedLot() {
  const lotId = `lot-${String(++Shipment.lots).padStart(2, '0')}`;
  const [lo, hi] = SOURCING.lotSize, n = lo + Math.floor(Math.random() * (hi - lo + 1));
  const base = genCelDef({ layer: 'character' }), first = 100 + Math.floor(Math.random() * 890);
  return Array.from({ length: n }, (_, i) => ({
    ...base, id: i === 0 ? base.id : nextCelId(), cut: `C-${first + i}`, lotId, lotIndex: i + 1, dx: (i - (n - 1) / 2) * 16,
  }));
}
function crateOccupied() {   // anything from a shipment still sitting on (or being examined off) the crate
  return cels.some((c) => c.userData.props.shipment && ['rest', 'held', 'returning'].includes(c.userData.state) &&
    c.userData.homePos.distanceTo(SHIP_TOP) < 0.6);

function deliverShipment(reason) {
  Shipment.wait = 0;

  const isLot = Math.random() < chance;
  const defs = isLot ? genMatchedLot() : [genCelDef()];
  defs.forEach((def, i) => {
    const [ox, oz] = CRATE_SLOTS[i];
    Object.assign(def, { foundAt: 'shipment crate', shipment: n,
      place: { x: SHIP_TOP.x + ox, y: SHIP_TOP.y, z: SHIP_TOP.z + oz, rx: -Math.PI / 2, ry: 0 } });
    CEL_DEFS.push(def);
    spawnCel(def);

  setFlag('shipments.delivered', n);
  const sceneId = sceneIdOf(defs[0].scene);
  if (isLot) {
    incFlag('lots.delivered');
    logEvent('lot', `matched lot ${defs[0].lotId}: ${defs.length} consecutive cuts of ${sceneId}`, {
      lotId: defs[0].lotId, sceneId, layer: 'character', cuts: defs.map((d) => d.cut), ids: defs.map((d) => d.id), shipment: n, lotChance: chance, reason,
    });
  } else {
    logEvent('shipment', `shipment #${n}: ${defs[0].id} (${defs[0].layer}, ${sceneId})`, { id: defs[0].id, sceneId, layer: defs[0].layer, lotChance: chance, reason });

// --- Per frame (runs seated or not: desk cels glide home, playback, reels, camera)
function updateCompose(dt) {
  const k = 1 - Math.exp(-12 * dt);
  for (const cel of cels) {   // glide desk + tray cels onto their target poses
    const u = cel.userData;
    if (!u.slot || (Compose.held && cel === Compose.held.cel)) continue;
    if (u.state !== 'onDesk' && !(u.state === 'carried' && cel.parent)) continue;
    cel.position.lerp(u.slot, k);
    cel.quaternion.slerp(u.slotQuat || FLAT, k);
    cel.scale.setScalar(cel.scale.x + ((u.slotScale || 1) - cel.scale.x) * k);
  }
  if (Compose.held) {   // held cel trails the hand, drawn in by the pegs, tilting with motion
    const { cel, reg } = Compose.held;
    holdTarget(_hold);
    _prev.copy(cel.position);
    cel.position.lerp(_hold, 1 - Math.exp(-COMPOSE.follow * dt));
    cel.scale.setScalar(cel.scale.x + (1 - cel.scale.x) * k);
    Compose.vel.lerp(_prev.subVectors(cel.position, _prev).divideScalar(Math.max(dt, 1e-3)), 0.25);
    const clampT = (v) => Math.max(-0.3, Math.min(0.3, v));
    _tilt.setFromEuler(_te.set(clampT(Compose.vel.z * 0.5), 0, clampT(-Compose.vel.x * 0.5)));
    cel.quaternion.slerp(_tilt.multiply(reg.quat), k);
    pegMat.emissive.setHex(heldInRegister() ? 0x8a6a20 : 0x000000);   // pegs warm up: "let go now"
  }
  if (Play.active) {   // flipbook: fixed-rate cuts, static on empty frames
    Play.t += dt;
    if (Play.t >= 1 / FLIP_FPS) {
      Play.t -= 1 / FLIP_FPS;
      Play.i = (Play.i + 1) % Play.seq.length;
      showFrame(Play.seq[Play.i]);
    } else if (staticCard.visible) refreshStatic();
  }
  updateReel(dt);
  updateShipments(dt);

  // Camera: blend from the walking eye to the seated view and back
  Compose.t += ((Compose.active ? 1 : 0) - Compose.t) * (1 - Math.exp(-COMPOSE.camBlend * dt));
  if (Compose.t < 0.001) Compose.t = 0;
  if (Compose.t > 0) {
    const e = Compose.t * Compose.t * (3 - 2 * Compose.t);
    camera.position.lerp(deskCamPos, e);
    camera.quaternion.slerp(deskCamQuat, e);
    crosshairEl.style.display = 'none';
  }
  handCursor.visible = Compose.active && Compose.t > 0.6 && !Play.active;
  if (handCursor.visible) {
    handCursor.position.set(Compose.cursor.x, DESK.h + 0.08, Compose.cursor.z);
    const hover = celUnderHand() || markerUnderHand() >= 0 || folderUnderHand();
    handCursor.material.color.setHex(Compose.held ? 0xffc86b : hover ? 0xfff2c8 : 0xffffff);
    handCursor.scale.setScalar(Compose.held ? 1.4 : 1);
  }
}

// =====================================================================
// 15. RESONANCE & NPC — compose -> delayed, unannounced NPC reaction
// =====================================================================
// Slice version of DESIGN.md §4.4: two tags only, Care and Violence (a
// tension pair). Each cel carries one (CEL_DEFS.resonance). When a reel
// completes, each cel in it adds +1 to its own tag. Opposed tags don't
// cancel: a reel with both bumps both.
//
// One NPC, "the regular", stands in the plaza. Once either counter reaches
// RESONANCE_THRESHOLD, their line silently swaps to a second one. Nothing in
// the world signals it (same voice, same UI, no effect); only the dev log
// records the moment ("npc-shift"). The player notices only if they go back
// and talk to them again.
const RESONANCE_TAGS = ['care', 'violence'];
const RESONANCE_THRESHOLD = 2;
RESONANCE_TAGS.forEach((t) => setFlag(`resonance:${t}`, 0));

function applyResonance(used) {
  const inc = {};
  for (const c of used) {
    const t = c.userData.props.resonance;
    if (RESONANCE_TAGS.includes(t)) inc[t] = (inc[t] || 0) + 1;
  }
  Object.entries(inc).forEach(([t, n]) => incFlag(`resonance:${t}`, n));
  const totals = Object.fromEntries(RESONANCE_TAGS.map((t) => [t, getFlag(`resonance:${t}`)]));
  logEvent('resonance', Object.entries(inc).map(([t, n]) => `+${n} ${t}`).join(', ') || 'no tags',
    { incremented: inc, cels: used.map(idOf), totals, reel: getFlag('reelsCompleted') });
  checkNpcShift();
}

function updateNpc(dt) {
  const t = performance.now() / 1000;
  const dx = player.x - Npc.pos.x, dz = player.z - Npc.pos.z, dist = Math.hypot(dx, dz);
  // Idle: breathing, a slow look around; turns toward the player when close
  Npc.torso.scale.y = 1 + Math.sin(t * 1.7) * 0.015;
  Npc.head.position.y = 1.6 + Math.sin(t * 1.7) * 0.004;
  const want = dist < 3.5 ? Math.atan2(dx, dz) : Npc.yaw + Math.sin(t * 0.35) * 0.6;
  let diff = want - npcGroup.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));   // shortest way round
  npcGroup.rotation.y += diff * (1 - Math.exp(-2 * dt));
  Npc.head.rotation.y = dist < 3.5 ? 0 : Math.sin(t * 0.9) * 0.25;

  Npc.canTalk = locked && dist < Npc.talkRange && !Examine.active && !Compose.active && !Examine.target && !Desk.target && !Desk.targetCel;
  if (Npc.canTalk && !dialogueEl.classList.contains('show')) {
    if (promptEl.textContent !== '[E] Talk') promptEl.textContent = '[E] Talk';
    promptEl.classList.add('show');
  }
  if (dialogueEl.classList.contains('show') && (performance.now() > Npc.sayUntil || dist > Npc.talkRange + 1.5 || Compose.active)) {
    dialogueEl.classList.remove('show');
  }
}

// =====================================================================
// 16. MAIN LOOP
// =====================================================================
const clock = new THREE.Clock();
const hud = document.getElementById('hud');

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp so a stalled tab can't tunnel through walls
  if (!Examine.active && !Compose.active) updatePlayer(dt);   // examining / sitting pauses walking
  camera.position.set(player.x, CONFIG.eyeHeight, player.z);
  camera.rotation.set(pitch, yaw, 0);
  updateCels(dt);
  updateSatchel();
  updateCompose(dt);   // after the others: overrides the camera while seated
  updateNpc(dt);
  updateKeyHints();
  hud.textContent = `x ${player.x.toFixed(1)}  z ${player.z.toFixed(1)}`;   // playtest readout
  renderer.render(scene, camera);
}
frame();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
